<template>
    <div class={contentClass}>
    <c-a-r-c_-collapsible-section 
        title="Company Contacts" 
        subtitle="Primary and secondary contact information"
        custom-icon-url={sectionIconUrl} 
        status={status}
        hide-status={hideStatusBadge}
        start-open={shouldStartOpen}
        accent-color="#A855F7" 
        hide-save="true"
        onsave={handleSave}>

        <div class="content-wrapper">
            <!-- Loading Spinner -->
            <template lwc:if={isLoading}>
                <div class="saving-overlay">
                    <div class="saving-message">
                        <lightning-spinner alternative-text="Loading contacts..." size="large"
                            variant="brand"></lightning-spinner>
                    </div>
                </div>
            </template>


            <!-- ═══════════════════════════════════════════════════════════════════════ -->
            <!-- PRIMARY BUSINESS CONTACT -->
            <!-- ═══════════════════════════════════════════════════════════════════════ -->
            <div class="primary-contact-card slds-m-bottom_medium">
                <div class="primary-contact-header">
                    <svg class="header-icon-custom" width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Primary Contact"><path d="M7.875 9C5.39138 9 3.375 6.98362 3.375 4.5C3.375 2.01638 5.39138 0 7.875 0C10.3586 0 12.375 2.01638 12.375 4.5C12.375 6.98362 10.3586 9 7.875 9ZM7.35117 12.6281L6.69727 11.5383C6.47227 11.1621 6.74297 10.6875 7.17891 10.6875H7.875H8.56758C9.00352 10.6875 9.27422 11.1656 9.04922 11.5383L8.39531 12.6281L9.56953 16.984L10.8352 11.8195C10.9055 11.5348 11.1797 11.3484 11.4645 11.4223C13.9289 12.041 15.75 14.2699 15.75 16.9207C15.75 17.5184 15.2648 18 14.6707 18H10.0371C9.96328 18 9.89648 17.9859 9.8332 17.9613L9.84375 18H5.90625L5.9168 17.9613C5.85352 17.9859 5.7832 18 5.71289 18H1.0793C0.485156 18 0 17.5148 0 16.9207C0 14.2664 1.82461 12.0375 4.28555 11.4223C4.57031 11.352 4.84453 11.5383 4.91484 11.8195L6.18047 16.984L7.35469 12.6281H7.35117Z" fill="currentColor"/></svg>
                    <span class="primary-contact-title">Primary Business Contact <abbr class="required-indicator" title="required">*</abbr></span>
                    <template lwc:if={isSaved}>
                        <span class="saved-indicator">
                            <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                            Saved
                        </span>
                    </template>
                </div>
                <p class="section-description slds-m-top_xx-small slds-m-bottom_small slds-m-horizontal_medium">UHSM's main point of contact for all account-related questions and communications.</p>
                <div class="primary-contact-body">
                    <!-- Display Mode: Show selected contact -->
                    <template lwc:if={showPrimaryContactDisplay}>
                        <div class="contact-info-row">
                            <div class="contact-avatar">
                                <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                            </div>
                            <div class="contact-details">
                                <p class="contact-name">{primaryContact.firstName} {primaryContact.lastName}</p>
                                <p class="contact-detail">{primaryContact.title} - {primaryContact.email}</p>
                            </div>
                            <template lwc:if={canEdit}>
                                <div class="contact-action">
                                    <a  class="change-link" onclick={handleChangePrimaryContact}>
                                        <lightning-icon icon-name="utility:edit" size="xx-small"
                                            class="edit-icon"></lightning-icon>
                                        Edit
                                    </a>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Edit Mode: Show portal access, method selection, and fields -->
                    <template lwc:if={canEdit}>
                    <template lwc:if={showPrimaryContactEdit}>
                        <!-- Save/Cancel buttons -->
                        <div class="slds-m-bottom_medium slds-text-align_right">
                            <template lwc:if={hasPrimaryContact}>
                                <lightning-button class="slds-m-right_small" variant="neutral" label="Cancel" icon-name="utility:back"
                                    onclick={handleCancelPrimaryContactEdit}>
                                </lightning-button>
                            </template>
                            <template lwc:if={isSaving}>
                                <div class="inline-spinner-container">
                                    <lightning-spinner size="small" variant="brand" alternative-text="Saving..."></lightning-spinner>
                                </div>
                            </template>
                            <template lwc:else>
                                <lightning-button variant="brand" label="Save" icon-name="utility:save"
                                    onclick={handleSave}>
                                </lightning-button>
                            </template>
                        </div>

                        <!-- Portal Access Dropdown -->
                        <div class="slds-m-bottom_medium">
                            <lightning-combobox data-id="primaryPortalAccess" label="Portal Access" value={primaryContact.portalAccess}
                                options={portalAccessOptions} required onchange={handlePortalAccessChange}>
                            </lightning-combobox>
                        </div>

                        <!-- Contact Selection Method Radio -->
                        <c-a-r-c_-radio-group label="Contact Selection Method" name="primaryContactMethod"
                            options={contactMethodOptions} value={primaryContactMethod} required
                            container-class="slds-m-bottom_medium" onchange={handlePrimaryContactMethodChange}>
                        </c-a-r-c_-radio-group>

                        <!-- Existing Contact: Show Lookup (only if no contact selected yet) -->
                        <template lwc:if={showPrimaryContactLookup}>
                            <c-a-r-c_-generic-lookup label="Search Contact" placeholder="Search contacts..."
                                object-type="Contact" icon-name="standard:contact" opportunity-id={effectiveRecordId} required
                                onselect={handlePrimaryContactSelect} data-field="primaryContact">
                            </c-a-r-c_-generic-lookup>
                        </template>


                        <!-- Existing Contact: Show Edit Fields (if contact already selected) -->
                        <template lwc:if={showPrimaryContactEditFields}>
                            <br>
                            <c-a-r-c_-contact-form 
                                title="Edit Contact Information" 
                                icon-name="standard:contact"
                                contact={primaryContact}
                                required
                                hide-address
                                onformchange={handlePrimaryContactEditChange}>
                            </c-a-r-c_-contact-form>
                        </template>

                        <!-- New Contact: Show Fields -->
                        <template lwc:if={showNewContactFields}>
                            <c-a-r-c_-contact-form 
                                title="New Contact Information" 
                                icon-name="standard:contact"
                                contact={newPrimaryContact}
                                required
                                hide-address
                                onformchange={handleNewPrimaryContactChange}>
                            </c-a-r-c_-contact-form>
                        </template>
                    </template>
                    </template><!-- /canEdit -->

                    <!-- Initial State: No contact yet -->
                    <template lwc:if={showInitialLookup}>
                        <c-a-r-c_-generic-lookup label="Select Primary Contact" placeholder="Search contacts..."
                            object-type="Contact" icon-name="standard:contact" opportunity-id={effectiveRecordId} required
                            onselect={handlePrimaryContactSelect}>
                        </c-a-r-c_-generic-lookup>
                    </template>
                </div>
            </div>

            <!-- ═══════════════════════════════════════════════════════════════════════ -->
            <!-- COMPANY OFFICER CONTACT -->
            <!-- ═══════════════════════════════════════════════════════════════════════ -->
            <div class="officer-contact-card slds-m-bottom_medium">
                <div class="officer-contact-header">
                    <svg class="header-icon-custom" width="23" height="18" viewBox="0 0 23 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Company Officer"><path d="M7.875 9C10.3586 9 12.375 6.98362 12.375 4.5C12.375 2.01638 10.3586 0 7.875 0C5.39138 0 3.375 2.01638 3.375 4.5C3.375 6.98362 5.39138 9 7.875 9ZM6.26836 10.6875C2.80547 10.6875 0 13.493 0 16.9559C0 17.5324 0.467578 18 1.04414 18H14.7059C14.7691 18 14.8289 17.993 14.8922 17.9824C12.2098 16.0453 11.3836 13.0254 11.2676 10.9441C10.7016 10.7754 10.1039 10.6875 9.48516 10.6875H6.26836ZM17.1246 7.93477L12.9059 9.62227C12.5859 9.75234 12.375 10.0617 12.375 10.4062C12.375 12.6316 13.2855 16.3406 17.1141 17.9367C17.3215 18.0246 17.557 18.0246 17.7645 17.9367C21.5895 16.3406 22.5 12.6316 22.5 10.4062C22.5 10.0617 22.2891 9.75234 21.9691 9.62227L17.7504 7.93477C17.55 7.85391 17.325 7.85391 17.1246 7.93477ZM20.7914 10.9688C20.6543 12.7512 19.8352 15.0715 17.4375 16.2316V9.62578L20.7914 10.9688Z" fill="currentColor"/></svg>
                    <span class="officer-contact-title">Company Officer Contact <abbr class="required-indicator" title="required">*</abbr></span>
                    <template lwc:if={isSaved}>
                        <span class="saved-indicator">
                            <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                            Saved
                        </span>
                    </template>
                </div>
                <p class="section-description slds-m-top_xx-small slds-m-bottom_small slds-m-horizontal_medium">The individual who signs the contract on behalf of the company.</p>
                <div class="officer-contact-body">
                    <!-- Radio: Same as Primary? -->
                    <c-a-r-c_-radio-group label="Is the Company Officer Contact the same as the Primary Business Contact?"
                        name="officerSameAsPrimary" options={yesNoOptions} value={officerSameAsPrimaryValue} required
                        variant="box" background-color="#ffffff" container-class="slds-m-bottom_medium"
                        onchange={handleOfficerSameChange}>
                    </c-a-r-c_-radio-group>

                    <!-- Display Mode: Show selected officer contact (when different from primary) -->
                    <template lwc:if={showOfficerContactDisplay}>
                        <div class="officer-info-row">
                            <div class="officer-avatar">
                                <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                            </div>
                            <div class="officer-details">
                                <p class="officer-name">{officerContact.firstName} {officerContact.lastName}</p>
                                <p class="officer-detail">{officerContact.title} - {officerContact.email}</p>
                            </div>
                            <template lwc:if={canEdit}>
                                <div class="officer-action">
                                    <a  class="change-link officer-change-link"
                                        onclick={handleChangeOfficerContact}>
                                        <lightning-icon icon-name="utility:edit" size="xx-small"
                                            class="edit-icon"></lightning-icon>
                                        Edit
                                    </a>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Edit/Selection Mode: Show when officer is different and needs selection -->
                    <template lwc:if={canEdit}>
                    <template lwc:if={showOfficerSelection}>
                        <!-- Save/Cancel buttons -->
                        <div class="slds-m-bottom_medium slds-text-align_right">
                            <template lwc:if={isEditingOfficerContact}>
                                <lightning-button class="slds-m-right_small" variant="neutral" label="Cancel" icon-name="utility:back"
                                    onclick={handleCancelOfficerContactEdit}>
                                </lightning-button>
                            </template>
                            <template lwc:if={isSaving}>
                                <div class="inline-spinner-container">
                                    <lightning-spinner size="small" variant="brand" alternative-text="Saving..."></lightning-spinner>
                                </div>
                            </template>
                            <template lwc:else>
                                <lightning-button variant="brand" label="Save" icon-name="utility:save"
                                    onclick={handleSave}>
                                </lightning-button>
                            </template>
                        </div>

                        <!-- Portal Access Dropdown -->
                        <div class="slds-m-bottom_medium">
                            <lightning-combobox data-id="officerPortalAccess" name="officerPortalAccess" label="Portal Access"
                                value={officerPortalAccess} options={portalAccessOptions} required
                                onchange={handleOfficerPortalAccessChange}>
                            </lightning-combobox>
                        </div>

                        <!-- Contact Selection Method Radio -->
                        <c-a-r-c_-radio-group label="Contact Selection Method" name="officerContactMethod"
                            options={contactMethodOptions} value={officerContactMethod} required
                            container-class="slds-m-bottom_medium" onchange={handleOfficerContactMethodChange}>
                        </c-a-r-c_-radio-group>

                        <!-- Existing Contact Lookup -->
                        <template lwc:if={showOfficerLookup}>
                            <c-a-r-c_-generic-lookup label="Select Company Officer" placeholder="Search contacts..."
                                object-type="Contact" icon-name="standard:contact" opportunity-id={effectiveRecordId} required
                                onselect={handleOfficerContactSelect}>
                            </c-a-r-c_-generic-lookup>
                        </template>

                        <!-- Existing Contact: Edit Fields (when contact already selected) -->
                        <template lwc:if={showOfficerEditFields}>
                            <br>
                            <c-a-r-c_-contact-form 
                                title="Edit Officer Contact Information" 
                                icon-name="standard:contact"
                                contact={officerContact}
                                required
                                hide-address
                                onformchange={handleOfficerContactEditChange}>
                            </c-a-r-c_-contact-form>
                        </template>

                        <!-- New Contact Fields -->
                        <template lwc:if={showNewOfficerContactFields}>
                            <c-a-r-c_-contact-form 
                                title="New Officer Contact Information" 
                                icon-name="standard:contact"
                                contact={newOfficerContact}
                                required
                                hide-address
                                onformchange={handleNewOfficerContactChange}>
                            </c-a-r-c_-contact-form>
                        </template>
                    </template>
                    </template><!-- /canEdit -->
                </div>
            </div>

            <!-- ═══════════════════════════════════════════════════════════════════════ -->
            <!-- ACCOUNT MODE ONLY: Account Holder, Billing Contact, Ownership -->
            <!-- ═══════════════════════════════════════════════════════════════════════ -->
            <template lwc:if={isAccountMode}>

                <!-- ACCOUNT HOLDER -->
                <div class="primary-contact-card slds-m-bottom_medium">
                    <div class="primary-contact-header">
                        <svg class="header-icon-custom" width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Account Holder"><path d="M7.875 9C5.39138 9 3.375 6.98362 3.375 4.5C3.375 2.01638 5.39138 0 7.875 0C10.3586 0 12.375 2.01638 12.375 4.5C12.375 6.98362 10.3586 9 7.875 9ZM7.35117 12.6281L6.69727 11.5383C6.47227 11.1621 6.74297 10.6875 7.17891 10.6875H7.875H8.56758C9.00352 10.6875 9.27422 11.1656 9.04922 11.5383L8.39531 12.6281L9.56953 16.984L10.8352 11.8195C10.9055 11.5348 11.1797 11.3484 11.4645 11.4223C13.9289 12.041 15.75 14.2699 15.75 16.9207C15.75 17.5184 15.2648 18 14.6707 18H10.0371C9.96328 18 9.89648 17.9859 9.8332 17.9613L9.84375 18H5.90625L5.9168 17.9613C5.85352 17.9859 5.7832 18 5.71289 18H1.0793C0.485156 18 0 17.5148 0 16.9207C0 14.2664 1.82461 12.0375 4.28555 11.4223C4.57031 11.352 4.84453 11.5383 4.91484 11.8195L6.18047 16.984L7.35469 12.6281H7.35117Z" fill="currentColor"/></svg>
                        <span class="primary-contact-title">Account Holder</span>
                        <template lwc:if={isSaved}>
                            <span class="saved-indicator">
                                <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                                Saved
                            </span>
                        </template>
                    </div>
                    <p class="section-description slds-m-top_xx-small slds-m-bottom_small slds-m-horizontal_medium">The individual who holds the account and is legally responsible for the group.</p>
                    <div class="primary-contact-body">
                        <c-a-r-c_-radio-group label="Is the Account Holder the same as the Primary Business Contact?"
                            name="accountHolderSameAsPrimary" options={yesNoOptions} value={accountHolderSameAsPrimaryValue} required
                            variant="box" background-color="#ffffff" container-class="slds-m-bottom_medium"
                            onchange={handleAccountHolderSameChange}>
                        </c-a-r-c_-radio-group>

                        <template lwc:if={showAccountHolderDisplay}>
                            <div class="contact-info-row">
                                <div class="contact-avatar">
                                    <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                </div>
                                <div class="contact-details">
                                    <p class="contact-name">{accountHolderContact.firstName} {accountHolderContact.lastName}</p>
                                    <p class="contact-detail">{accountHolderContact.title} - {accountHolderContact.email}</p>
                                </div>
                                <template lwc:if={canEdit}>
                                    <div class="contact-action">
                                        <a class="change-link" onclick={handleChangeAccountHolder}>
                                            <lightning-icon icon-name="utility:edit" size="xx-small" class="edit-icon"></lightning-icon>
                                            Edit
                                        </a>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template lwc:if={canEdit}>
                        <template lwc:if={showAccountHolderEdit}>
                            <!-- Save/Cancel buttons -->
                            <div class="slds-m-bottom_medium slds-text-align_right">
                                <template lwc:if={hasAccountHolder}>
                                    <lightning-button class="slds-m-right_small" variant="neutral" label="Cancel" icon-name="utility:back"
                                        onclick={handleCancelAccountHolderEdit}>
                                    </lightning-button>
                                </template>
                                <template lwc:if={isSaving}>
                                    <div class="inline-spinner-container">
                                        <lightning-spinner size="small" variant="brand" alternative-text="Saving..."></lightning-spinner>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <lightning-button variant="brand" label="Save" icon-name="utility:save"
                                        onclick={handleSave}>
                                    </lightning-button>
                                </template>
                            </div>

                            <div class="slds-m-bottom_medium">
                                <lightning-combobox label="Portal Access" value={accountHolderContact.portalAccess}
                                    options={portalAccessOptions} required
                                    onchange={handleAccountHolderPortalAccessChange}>
                                </lightning-combobox>
                            </div>

                            <c-a-r-c_-radio-group label="Contact Selection Method" name="accountHolderMethod"
                                options={contactMethodOptions} value={accountHolderContactMethod} required
                                container-class="slds-m-bottom_medium" onchange={handleAccountHolderMethodChange}>
                            </c-a-r-c_-radio-group>

                            <template lwc:if={showAccountHolderLookup}>
                                <c-a-r-c_-generic-lookup label="Search Contact" placeholder="Search contacts..."
                                    object-type="Contact" icon-name="standard:contact" opportunity-id={effectiveRecordId} required
                                    onselect={handleAccountHolderSelect}>
                                </c-a-r-c_-generic-lookup>
                            </template>

                            <template lwc:if={showAccountHolderEditFields}>
                                <br>
                                <c-a-r-c_-contact-form title="Edit Account Holder" icon-name="standard:contact"
                                    contact={accountHolderContact} required hide-address
                                    onformchange={handleAccountHolderEditChange}>
                                </c-a-r-c_-contact-form>
                            </template>

                            <template lwc:if={showNewAccountHolderFields}>
                                <c-a-r-c_-contact-form title="New Account Holder" icon-name="standard:contact"
                                    contact={newAccountHolderContact} required hide-address
                                    onformchange={handleNewAccountHolderChange}>
                                </c-a-r-c_-contact-form>
                            </template>
                        </template>
                        </template><!-- /canEdit -->
                    </div>
                </div>

                <!-- BILLING CONTACT -->
                <div class="officer-contact-card slds-m-bottom_medium">
                    <div class="officer-contact-header">
                        <svg class="header-icon-custom" width="23" height="18" viewBox="0 0 23 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Billing Contact"><path d="M7.875 9C10.3586 9 12.375 6.98362 12.375 4.5C12.375 2.01638 10.3586 0 7.875 0C5.39138 0 3.375 2.01638 3.375 4.5C3.375 6.98362 5.39138 9 7.875 9ZM6.26836 10.6875C2.80547 10.6875 0 13.493 0 16.9559C0 17.5324 0.467578 18 1.04414 18H14.7059C14.7691 18 14.8289 17.993 14.8922 17.9824C12.2098 16.0453 11.3836 13.0254 11.2676 10.9441C10.7016 10.7754 10.1039 10.6875 9.48516 10.6875H6.26836ZM17.1246 7.93477L12.9059 9.62227C12.5859 9.75234 12.375 10.0617 12.375 10.4062C12.375 12.6316 13.2855 16.3406 17.1141 17.9367C17.3215 18.0246 17.557 18.0246 17.7645 17.9367C21.5895 16.3406 22.5 12.6316 22.5 10.4062C22.5 10.0617 22.2891 9.75234 21.9691 9.62227L17.7504 7.93477C17.55 7.85391 17.325 7.85391 17.1246 7.93477ZM20.7914 10.9688C20.6543 12.7512 19.8352 15.0715 17.4375 16.2316V9.62578L20.7914 10.9688Z" fill="currentColor"/></svg>
                        <span class="officer-contact-title">Billing Contact</span>
                        <template lwc:if={isSaved}>
                            <span class="saved-indicator">
                                <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                                Saved
                            </span>
                        </template>
                    </div>
                    <p class="section-description slds-m-top_xx-small slds-m-bottom_small slds-m-horizontal_medium">The individual responsible for billing and payment communications.</p>
                    <div class="officer-contact-body">
                        <c-a-r-c_-radio-group label="Is the Billing Contact the same as the Account Holder?"
                            name="billingSameAsAccountHolder" options={yesNoOptions} value={billingSameAsAccountHolderValue} required
                            variant="box" background-color="#ffffff" container-class="slds-m-bottom_medium"
                            onchange={handleBillingSameChange}>
                        </c-a-r-c_-radio-group>

                        <template lwc:if={showBillingContactDisplay}>
                            <div class="officer-info-row">
                                <div class="officer-avatar">
                                    <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                </div>
                                <div class="officer-details">
                                    <p class="officer-name">{billingContact.firstName} {billingContact.lastName}</p>
                                    <p class="officer-detail">{billingContact.title} - {billingContact.email}</p>
                                </div>
                                <template lwc:if={canEdit}>
                                    <div class="officer-action">
                                        <a class="change-link officer-change-link" onclick={handleChangeBillingContact}>
                                            <lightning-icon icon-name="utility:edit" size="xx-small" class="edit-icon"></lightning-icon>
                                            Edit
                                        </a>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template lwc:if={canEdit}>
                        <template lwc:if={showBillingContactEdit}>
                            <!-- Save/Cancel buttons -->
                            <div class="slds-m-bottom_medium slds-text-align_right">
                                <template lwc:if={isEditingBillingContact}>
                                    <lightning-button class="slds-m-right_small" variant="neutral" label="Cancel" icon-name="utility:back"
                                        onclick={handleCancelBillingContactEdit}>
                                    </lightning-button>
                                </template>
                                <template lwc:if={isSaving}>
                                    <div class="inline-spinner-container">
                                        <lightning-spinner size="small" variant="brand" alternative-text="Saving..."></lightning-spinner>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <lightning-button variant="brand" label="Save" icon-name="utility:save"
                                        onclick={handleSave}>
                                    </lightning-button>
                                </template>
                            </div>

                            <div class="slds-m-bottom_medium">
                                <lightning-combobox label="Portal Access" value={billingContactPortalAccess}
                                    options={portalAccessOptions} required
                                    onchange={handleBillingContactPortalAccessChange}>
                                </lightning-combobox>
                            </div>

                            <c-a-r-c_-radio-group label="Contact Selection Method" name="billingContactMethod"
                                options={contactMethodOptions} value={billingContactMethod} required
                                container-class="slds-m-bottom_medium" onchange={handleBillingContactMethodChange}>
                            </c-a-r-c_-radio-group>

                            <template lwc:if={showBillingContactLookup}>
                                <c-a-r-c_-generic-lookup label="Search Contact" placeholder="Search contacts..."
                                    object-type="Contact" icon-name="standard:contact" opportunity-id={effectiveRecordId} required
                                    onselect={handleBillingContactSelect}>
                                </c-a-r-c_-generic-lookup>
                            </template>

                            <template lwc:if={showBillingContactEditFields}>
                                <br>
                                <c-a-r-c_-contact-form title="Edit Billing Contact" icon-name="standard:contact"
                                    contact={billingContact} required hide-address
                                    onformchange={handleBillingContactEditChange}>
                                </c-a-r-c_-contact-form>
                            </template>

                            <template lwc:if={showNewBillingContactFields}>
                                <c-a-r-c_-contact-form title="New Billing Contact" icon-name="standard:contact"
                                    contact={newBillingContact} required hide-address
                                    onformchange={handleNewBillingContactChange}>
                                </c-a-r-c_-contact-form>
                            </template>
                        </template>

                </div>

                        <div class="slds-grid slds-grid_vertical-center">

                                    <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                                    Saved
                                </span>

                                onclick={handleAddOtherContact}>
                            </lightning-button>
                        </div>
                    </template>
                </div>
                <p class="section-description slds-m-top_xx-small slds-m-bottom_small slds-m-horizontal_medium">Company employees who may be granted access to the Employer Portal.</p>
                <div class="section-card-body">
                    <div class="table-spinner-container">
                        <template lwc:if={isSavingOtherContact}>
                            <div class="table-spinner-overlay">
                                <lightning-spinner size="small" variant="brand" alternative-text="Saving..."></lightning-spinner>
                            </div>
                        </template>
                        <c-a-r-c_-form-table columns={otherContactColumns} rows={otherContactsWithFullName}
                            empty-message="No other contacts added yet." oneditrow={handleEditOtherContact}
                            onremoverow={handleRemoveOtherContact} row-count-label="contacts"
                            read-only={isReadOnly} is-community={isCommunity}>
                        </c-a-r-c_-form-table>
                    </div>
                </div>
            </div>
