<template>
    <img src={imageUrl} alt="Upload Logo" class="logo"/>
    <lightning-card title="Please upload csv file using the button below." class="slds-text-body_small">
        <template if:true={caseId}>
            <div class="centered-container">
                <!-- <lightning-file-upload
                    label=""
                    accept=".csv"
                    record-id={caseId}
                    file-field-name="Guest_Record_fileupload__c"
                    file-field-value={caseId}
                    onuploadfinished={handleUploadFinished}
                    multiple="true">
                </lightning-file-upload> -->
                <lightning-file-upload
                    label=""
                    accept=".csv"
                    onuploadfinished={handleUploadFinished}
                    multiple="true">
                </lightning-file-upload>
            </div>
        </template>
        <template if:false={caseId}>
            <p class="slds-text-color_error">Error: Case ID is missing from the URL.</p>
        </template>
    </lightning-card>
    
    <template if:true={showSuccessModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-labelledby="modal-heading-01" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Success</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>File uploaded successfully!</p>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={closeModal}>OK</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
