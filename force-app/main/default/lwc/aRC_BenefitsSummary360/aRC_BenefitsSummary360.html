<template>
    <template lwc:if={isLoaded}>
        <div class="slds-box">
            <div class="text-header">Selected Plans</div>
            <template for:each={products} for:item="product" >
                <div key={product.name} class="">
                    <c-a-r-c_-benefits-summary-row product={product} hideeffectivedates=true showprogramdetails=true></c-a-r-c_-benefits-summary-row>
                </div>
            </template>
        </div>
    </template>
    <template lwc:else>
       <!-- Spinner -->
        <div style="height:6rem;">
            <div class="slds-spinner_container">
              <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                <span class="slds-assistive-text">Loading</span>
                <div class="slds-spinner__dot-a"></div>
                <div class="slds-spinner__dot-b"></div>
              </div>
            </div>
          </div>
    </template>
</template>
