<template>
    <template if:true={enableComponent}>
        <article class="slds-card slds-card_boundary headerBottomBorder forceRelatedListCardDesktop">
            <div class="slds-grid slds-page-header forceRelatedListCardHeader">
                <header class="slds-media slds-media--center slds-has-flexi-truncate">
                    <div class="slds-media__figure stencil slds-avatar slds-avatar_small">
                        <lightning-icon icon-name="standard:email_chatter" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            Resend Email    
                        </h2>
                    </div>
                </header>
            </div>

            <div class="demo-only demo-only--sizing slds-grid slds-wrap">
                <div class="slds-size_1-of-2">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-m-around_x-small">
                        <lightning-button   
                            variant="brand"
                            id="resendEnvelopeBtn"  
                            label="Resend Envelope"  
                            title="Resend Contract" 
                            onclick={resendContract} 
                            class="slds-button slds-align_absolute-center"
                            disabled={disableButton}
                            >
                        </lightning-button>
                    </div>
                </div>
                <div class="slds-size_1-of-2">
                    <div class="slds-box slds-box_x-small slds-text-align_center slds-m-around_x-small">
                        {message}
                    </div>                    
                </div>

                <div if:true={showSelect} class="slds-size_2-of-2">
                    <div if:false={sendingEnvelope} class="slds-box slds-box_x-small slds-text-align_center slds-m-around_x-small">
                        <lightning-combobox 
                            label="Recipient"
                            value={recipientEmail} 
                            placeholder="Select Recipient" 
                            options={hipaas} 
                            onchange={handleChange}
                            disabled={enableComboboxRecipientButton}>
                        </lightning-combobox>
                    </div>
                </div>
                <div class="docuSignSelectComboBoxContainer slds-align_absolute-center">
                    <lightning-spinner if:true={sendingEnvelope} 
                        alternative-text="Sending envelope..." 
                        style="position:relative; display:flex; padding: 1em">
                    </lightning-spinner>
                </div>
            </div>

          
        </article>
       
                    
    
    </template>
</template>
