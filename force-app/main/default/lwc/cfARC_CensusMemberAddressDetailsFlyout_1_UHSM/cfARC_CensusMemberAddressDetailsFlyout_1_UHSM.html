<template>
            <div class="nds-grid nds-wrap nds-is-relative ">
            <div style="position: fixed;z-index: 999999;top: 0;right: 0;">
  <vlocity_ins-toast class="flexcard-toast-element" theme="nds" title="" message="" styletype=""> </vlocity_ins-toast>
</div>
            <div if:true={showLoader} class="nds-is-absolute vloc-loader_override" style="height: 100%; width: 100%; min-height:50px; background: transparent; z-index: 99;">
  <div>
   <vlocity_ins-spinner
      variant="brand"
      alternative-text="Loading content..."
      size="small"
      theme="nds"
      ></vlocity_ins-spinner>
  </div>
</div>
            <template if:false={hasPermission}>
              You don't have required permissions to view this card.
            </template>
            <template if:true={hasPermission}>
              <template if:true={hasRecords}>
                        <template for:each={_records} for:item="record" for:index="rindex">
                            <vlocity_ins-flex-card-state if:true={record}  key={record._flex.uniqueKey} data-recordid={record.Id} record={record} data-statue="true"  data-index="0" data-rindex={rindex} class="cf-vlocity-state-0 cf-vlocity-state nds-size_12-of-12"  tracking-obj={_childCardTrackingObj} >
      <div if:true={cardLoaded} class="nds-grid nds-wrap nds-card nds-p-around_x-small nds-m-bottom_x-small" style="">
          <div data-style-id="state0element0" class="nds-col  nds-theme_warning nds-text-align_center nds-p-around_xx-small nds-p-around_small  nds-size_12-of-12  " data-rindex={rindex} style="      
         " ><vlocity_ins-output-field data-style-id="state0element0_child"   record={record}  card={card}  merge-field="%3Cdiv%20class=%22nds-text-color_default%20nds-text-heading_small%22%3EBoth%20the%20Member%20and%20the%20Contract%20need%20to%20be%20Active%3C/div%3E%0A%3Cdiv%20class=%22nds-text-color_default%20nds-text-heading_small%22%3Eor%3C/div%3E%0A%3Cdiv%20class=%22nds-text-body_regular%20nds-text-color_default%22%3E%3Cspan%20style=%22font-size:%2012pt;%22%3EThis%20member%20is%20not%20authorized%20to%20start%20a%20Program%20Change.%3C/span%3E%3C/div%3E"  theme="nds"  ></vlocity_ins-output-field>
      </div>
        </div>
      </vlocity_ins-flex-card-state>
                        </template>
                      </template>
                      <template if:false={hasRecords}>
                            <vlocity_ins-flex-card-state  record={record} data-statue="false"  data-index="0" data-rindex={rindex} class="cf-vlocity-state-0 cf-vlocity-state nds-size_12-of-12"  tracking-obj={_childCardTrackingObj} >
      <div if:true={cardLoaded} class="nds-grid nds-wrap nds-card nds-p-around_x-small nds-m-bottom_x-small" style="">
          <div data-style-id="state0element0" class="nds-col  nds-theme_warning nds-text-align_center nds-p-around_xx-small nds-p-around_small  nds-size_12-of-12  " data-rindex={rindex} style="      
         " ><vlocity_ins-output-field data-style-id="state0element0_child"   record={record}  card={card}  merge-field="%3Cdiv%20class=%22nds-text-color_default%20nds-text-heading_small%22%3EBoth%20the%20Member%20and%20the%20Contract%20need%20to%20be%20Active%3C/div%3E%0A%3Cdiv%20class=%22nds-text-color_default%20nds-text-heading_small%22%3Eor%3C/div%3E%0A%3Cdiv%20class=%22nds-text-body_regular%20nds-text-color_default%22%3E%3Cspan%20style=%22font-size:%2012pt;%22%3EThis%20member%20is%20not%20authorized%20to%20start%20a%20Program%20Change.%3C/span%3E%3C/div%3E"  theme="nds"  ></vlocity_ins-output-field>
      </div>
        </div>
      </vlocity_ins-flex-card-state>
                      </template>
            </template>
            <template if:true={hasError}>
            {error}
            </template>
            
      <vlocity_ins-action action-wrapperclass="slds-hide" re-render-flyout class="action-trigger slds-col" onupdateos={updateOmniscript} onselectcards={updateSelectedCards} onsetvalue={updateAction} onfireactionevent={actionEvtHandler}>
      
      </vlocity_ins-action>
  
            <vlocity_ins-action class="execute-action" re-render-flyout action-wrapperclass="slds-hide" onupdateos={updateOmniscript} onselectcards={updateSelectedCards} onsetvalue={updateAction} onfireactionevent={actionEvtHandler}>
            
            </vlocity_ins-action>
            </div>
          </template>
