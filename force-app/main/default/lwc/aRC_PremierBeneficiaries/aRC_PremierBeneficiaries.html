<template>

    <div class="member-container">
        <template for:each={adultCensusMembers} for:item="member" for:index="memberindex">

            <!-- MEMBER ACCORDION -->
            <lightning-accordion
                allow-multiple-sections-open
                key={member.Id}
                active-section-name={member.memberOpenSections}>

                <!-- MEMBER SECTION -->
                <lightning-accordion-section
                    name={member.Id}
                    label={member.label}
                    key={member.Id}
                    class="accordion-section"
                    style={member.accordionStyle}>
                    
                    <div class="beneficiaries-container">

                        <!-- BENEFICIARY ACCORDION -->
                        <lightning-accordion
                            allow-multiple-sections-open
                            active-section-name={member.beneficiaryOpenSections}>

                            <template for:each={member.beneficiaries} for:item="beneficiary" for:index="beneficiaryindex">

                                <lightning-accordion-section
                                    key={beneficiary.Id}
                                    name={beneficiary.Id}
                                    label={beneficiary.Label}>

                                    <div class="rmv-member-btn-container">
                                        <vlocity_ins-icon
                                            data-memberindex={memberindex}
                                            data-beneficiaryindex={beneficiaryindex}
                                            onclick={handler_RemoveMember}
                                            color="#d0242c"
                                            icon-name="utility:delete"
                                            size="x-small"
                                            theme={theme}>
                                        </vlocity_ins-icon>
                                    </div>

                                    <!-- Fields -->
                                    <div class="text-fields-container">

                                        <vlocity_ins-input
                                            type="text"
                                            name="BeneficiaryName"
                                            data-memberindex={memberindex}
                                            data-beneficiaryindex={beneficiaryindex}
                                            onchange={handler_FieldOnChange}
                                            label="Beneficiary Name"
                                            value={beneficiary.BeneficiaryName}
                                            required="true"
                                            theme={theme}>
                                        </vlocity_ins-input>
                                            
                                        <vlocity_ins-input
                                            type="date"
                                            name="BeneficiaryBirthdate"
                                            data-memberindex={memberindex}
                                            data-beneficiaryindex={beneficiaryindex}
                                            onchange={handler_FieldOnChange}
                                            label="Birthdate"
                                            value={beneficiary.BeneficiaryBirthdate}
                                            required="true"
                                            format="MM-DD-YYYY"
                                            output-format="YYYY-MM-DD"
                                            theme={theme}>
                                        </vlocity_ins-input>

                                        <vlocity_ins-masked-input
                                            name="BeneficiaryPhone"
                                            data-memberindex={memberindex}
                                            data-beneficiaryindex={beneficiaryindex}
                                            onchange={handler_FieldOnChange}
                                            label="Beneficiary Phone"
                                            value={beneficiary.BeneficiaryPhone}
                                            required="true"
                                            theme={theme}>
                                        </vlocity_ins-masked-input>

                                        <vlocity_ins-combobox
                                            name="BeneficiaryRelationship"
                                            options={relationshipOptions}
                                            data-memberindex={memberindex}
                                            data-beneficiaryindex={beneficiaryindex}
                                            onchange={handler_FieldOnChange}
                                            label="Beneficiary Relationship"
                                            value={beneficiary.BeneficiaryRelationship}
                                            required="true"
                                            theme={theme}>
                                        </vlocity_ins-combobox>

                                        <template if:true={beneficiary.isOtherRelationship}>
                                            <vlocity_ins-input
                                                name="BeneficiaryOtherRelationship"
                                                data-memberindex={memberindex}
                                                data-beneficiaryindex={beneficiaryindex}
                                                onchange={handler_FieldOnChange}
                                                label="Other Relationship"
                                                value={beneficiary.BeneficiaryOtherRelationship}
                                                required="true"
                                                theme={theme}>
                                            </vlocity_ins-input>
                                        </template>

                                    </div>

                                    <template for:each={beneficiary.errors} for:item="error">
                                        <span key={error.field} class="error-container error-txt">
                                            {error.error_message}
                                        </span>
                                    </template>

                                </lightning-accordion-section>

                            </template>

                        </lightning-accordion>

                        <!-- Add button -->
                        <br>
                        <lightning-button lwc:if={member.canAddBeneficiary}
                            label="Add Beneficiary"
                            data-memberindex={memberindex}
                            data-beneficiaryindex={beneficiaryindex}
                            onclick={handleAddBeneficiary}
                            theme={theme}>
                        </lightning-button>

                    </div>

                </lightning-accordion-section>

            </lightning-accordion>

        </template>
    </div>

    <template if:true={hasValidationErrors}>
        <div class="error-banner">
            Some beneficiary information is invalid. Please review the errors above.
        </div>
    </template>

    <!-- next & previous buttons -->
    <div class="button-container">
        <button class="vlocity-btn nds-button nds-button_brand nds-button_stretch" onclick={handler_NextStep} theme={theme}>Next</button>
        <button class="vlocity-btn nds-button nds-button_neutral nds-button_stretch" onclick={handler_PreviousStep} theme={theme}>Previous</button>
    </div>

</template>
