<template>
	<template lwc:if={disableComponent}>
	<img class="logo" src={imageUrls.weShareLogoUrl}>
	<h2 class="header-text">Change Your Username and Password</h2>
	<div class="main-container">
		<div class="centered-container">
			<div class="padding-top">
				<p>Enter a new username and password</p>
				<p>Ensure your password meets the following requirements:</p>
			</div>
			<li>
				<img data-id="length" src={imageUrls.disabledCheckboxUrl}>
				<span>8 characters</span>
			</li>
			<li>
				<img data-id="lowercase" src={imageUrls.disabledCheckboxUrl}>
				<span>1 letter</span>
			</li>
			<li>
				<img data-id="number" src={imageUrls.disabledCheckboxUrl}>
				<span>1 number</span>
			</li>
			<li>
				<img data-id="uppercase" src={imageUrls.disabledCheckboxUrl}>
				<span>Uppercase letter</span>
			</li>
			<li>
				<img data-id="special" src={imageUrls.disabledCheckboxUrl}>
				<span>Special character</span>
			</li>
			<li>
				<img data-id="password_confirm" src={imageUrls.disabledCheckboxUrl}>
				<span>Passwords match</span>
			</li>

			<div class="margin-top-small">
				<!-- USERNAME -->
				<p><span style="font-size: 13px; color:#CF4F43;font-family:SFS, Arial, sans-serif">*</span>New Username</p>
				<input type="text" oninput={handleInputChange} data-key="username"></input>
				<span lwc:if={formValidations.username_format}></span>
				<span lwc:else class="invalid">No spaces allowed, 8 to 30 letters, numbers, or - _ . @</span>
				<span lwc:if={formValidations.username_availability}></span>
				<span lwc:else class="invalid">This username is already taken.</span>
				<!-- PASSWORD -->
				<p><span style="font-size: 13px; color:#CF4F43;font-family:SFS, Arial, sans-serif">*</span>New
					Password
				</p>
				<div class="flex-container">
					<input type="password" data-key="password" oninput={handleInputChange}></input>
					<lightning-button-icon variant="bare" data-id="password" icon-name="utility:preview"
						class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
						alternative-text="Preview" title="See password"
						onclick={handleChangeType}></lightning-button-icon>
				</div>
				<!-- PASSWORD CONFIRM -->
				<p><span style="font-size: 13px; color:#CF4F43;font-family:SFS, Arial, sans-serif">*</span>Confirm
					New
					Password</p>
				<div class="flex-container">
					<input type="password" data-key="password_confirm" oninput={handleInputChange}></input>
					<lightning-button-icon variant="bare" data-id="password_confirm" icon-name="utility:preview"
						class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
						alternative-text="Preview" title="See confirmation"
						onclick={handleChangeType}></lightning-button-icon>
				</div>


			</div>
			<span lwc:if={formValidations.old_password}></span>
			<span lwc:else class="invalid">You cannot reuse this old password</span>

			<button onclick={handleSubmitButton} disabled={disableButton}><span lwc:if={showSpinner} class="spinner"></span>Change</button>
		</div>
	</div>
	</template>
</template>
