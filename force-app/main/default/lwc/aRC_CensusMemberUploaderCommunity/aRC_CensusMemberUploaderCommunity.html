<template>
    <!-- Modal -->
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{modalHeader}</h2>
                    <button class="slds-button slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-spinner lwc:if={isLoading} alternative-text="Loading" size="medium"></lightning-spinner>

                    <!-- Instructions -->
                    <div class="slds-box slds-theme_info slds-m-bottom_medium">
                        <div class="slds-grid slds-grid_vertical-align-start">
                            <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_small"></lightning-icon>
                            <div>
                                <p class="slds-text-body_regular slds-m-bottom_x-small">
                                    <strong>Upload a CSV file to add new census members.</strong>
                                </p>
                                <ul class="slds-list_dotted slds-text-body_small">
                                    <li>New members will be added to your census</li>
                                    <li>Existing members (matched by SSN) will be skipped</li>
                                    <li>All validations must pass before saving</li>
                                </ul>
                                <div class="slds-m-top_small">
                                    <lightning-button
                                        label="Download CSV Template"
                                        icon-name="utility:download"
                                        variant="neutral"
                                        onclick={handleDownloadTemplate}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Census Stats -->
                    <template lwc:if={hasCensus}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <p><strong>Current Census Members:</strong> {memberCount}</p>
                        </div>
                    </template>

                    <!-- CSV Upload Section -->
                    <div class="slds-m-bottom_medium">
                        <lightning-input 
                            type="file" 
                            label="Select CSV File" 
                            accept=".csv" 
                            onchange={handleFileChange}
                        ></lightning-input>
                        
                        <template lwc:if={files.length}>
                            <ul class="slds-m-top_small">
                                <template for:each={files} for:item="file">
                                    <li key={file.name} class="slds-grid slds-grid_align-spread slds-p-around_x-small slds-border_bottom">
                                        <span class="slds-col">
                                            <lightning-icon icon-name="doctype:csv" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                            {file.name}
                                        </span>
                                        <lightning-button-icon
                                            icon-name="utility:close"
                                            alternative-text="Remove"
                                            title="Remove file"
                                            onclick={handleRemove}
                                            data-name={file.name}
                                            class="slds-col_bump-left"
                                        ></lightning-button-icon>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </div>

                    <!-- Error Display Section -->
                    <template lwc:if={hasErrors}>
                        <div class="slds-m-bottom_medium">
                            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                <h2 class="slds-text-heading_small slds-m-bottom_small">
                                    <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                                    Validation Errors Found ({validationErrors.length})
                                </h2>
                                <div class="slds-text-body_small">
                                    <p class="slds-m-bottom_small"><strong>Please fix the following issues in your CSV file:</strong></p>
                                    <div class="error-container">
                                        <ul class="slds-list_dotted">
                                            <template for:each={validationErrors} for:item="error">
                                                <li key={error} class="slds-m-bottom_xx-small error-item">{error}</li>
                                            </template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- CSV Preview -->
                    <template lwc:if={showPreview}>
                        <div>
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                                <h3 class="slds-text-heading_small">CSV Preview ({csvData.length} row(s))</h3>
                            </div>
                            <div class="preview-container">
                                <lightning-datatable 
                                    key-field="SSN" 
                                    data={csvData} 
                                    columns={columns}
                                    hide-checkbox-column
                                ></lightning-datatable>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button 
                        label="Cancel" 
                        onclick={closeModal}
                    ></lightning-button>
                    <lightning-button 
                        variant="brand" 
                        label="Upload Members" 
                        onclick={handleCreateRecords}
                        disabled={isLoading}
                        lwc:if={showPreview}
                    ></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
