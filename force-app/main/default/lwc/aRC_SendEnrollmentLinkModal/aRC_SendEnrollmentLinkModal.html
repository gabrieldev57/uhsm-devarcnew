<template>
   <template if:true={isOpen}>
        <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{flowTitle}</h2>
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        class="slds-modal__close"
                        onclick={handleClose}>
                    </lightning-button-icon>
                </header>

                <!-- Body: Flow -->
            <div class="slds-modal__content slds-p-around_medium" style="background-color: white !important;">
                <lightning-flow key={flowKey} flow-api-name={flowApiName} flow-input-variables={flowInputVariables} onstatuschange={handleFlowStatusChange}>
                </lightning-flow>
            </div>
            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open" onclick={handleClose}></div>
    </template>
</template>
