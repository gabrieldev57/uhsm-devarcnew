<template>
    <div class="slds-grid slds-form-element slds-align_absolute-center">
        <div class="slds-col">
            <div if:true={error}>
                <div class="errorMessage">{errorMessage}</div>
            </div>
            <!--Input Username-->
            <div class="slds-grid slds-wrap slds-p-around_medium slds-box slds-box_small slds-m-bottom_small">
                <lightning-icon icon-name="utility:user" alternative-text="Username" size="xx-small" title="small size" class="slds-col slds-size_1-of-12 slds-icon-utility-user slds-icon_container slds-p-top_x-small slds-p-left_small inputIcons">
                </lightning-icon>
                <input type="text" id="input_username" placeholder="Username"  class="slds-input slds-col slds-size_11-of-12 form_inputs" data-key="inputUsername"  onchange={handleUsernameChange} />
            </div>  
            <!--Reset Button-->
            <div class="slds-form-element__control slds-size_12-of-12" >
                <button class="slds-button slds-button_neutral slds-size_12-of-12 resetButton" onclick={handleReset}><span lwc:if={showSpinner} class="spinner"></span>Reset Password</button>
            </div>
        </div>
    </div>
</template>
