<template>
    <div class="container">
        <div if:true={showDuplicate} class="alert danger-alert" onanimationend={handleAnimationEnd}>
            <h3>This SMB is the Duplicate of:
                <a data-id={smbDuplicateId} onclick={handleNavigate} style="color: hsl(0, 0%, 0%);"> {smbDuplicateName}</a>
                <!-- <a onclick={handleClose} class="close">&times;</a>-->
            </h3>
        </div>

        <div if:true={showPartialDuplicate} class="alert warning-alert" onanimationend={handleAnimationEnd}>
            <h3>This SMB is a Partial Duplicate of:
                <a data-id={smbDuplicateId} onclick={handleNavigate} style="color: hsl(0, 0%, 0%);"> {smbDuplicateName}</a>
            </h3>

            <!-- <a onclick={handleClose} class="close">&times;</a> -->
        </div>
    </div>
