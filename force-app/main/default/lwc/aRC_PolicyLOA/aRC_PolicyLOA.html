<template>
    <!-- <lightning-card class="slds-m-around_medium"> -->
        <template lwc:if={hasUpcomingRecords}>
        <div class="dynamic-form-container"> 
            <!-- Header --> 
             <div class="slds-grid slds-grid_vertical-align-center"> 
                <div> 
                    <h2 class="header"> Leave of Absence Management </h2> 
                </div> 
                <div class="slds-col_bump-left">
                    <template lwc:if={showEditButton}>
                        <button class="edit-btn" onclick={handleEdit}>
                            <lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>
                            Edit
                        </button>
                    </template>
                    <template if:true={recordId}> 
                    <!-- <lightning-badge label="Policies">

                    </lightning-badge>  -->
                </template> 
            </div> 
        </div> 
        <!-- Loading --> 
         <template if:true={isLoading}> 
            <div class="slds-var-p-vertical_xx-large slds-align_absolute-center"> 
                <lightning-spinner alternative-text="Loading Leave of Absence records" size="large"> 

                </lightning-spinner> 
            </div> 
        </template> 
        <!-- Error --> 
         <template if:true={error}> 
            <div class="slds-var-p-around_medium"> 
                <lightning-alert variant="error" title="Error" message={errorMessage}> 

                </lightning-alert> 
            </div> 
        </template> 

        <!-- Inputs --> 
         <template if:true={hasRecords}>
            <template if:false={isLoading}>

                <div class="slds-var-p-around_medium">

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">

                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Submitted Date</th>
                                <th scope="col">Start Date</th>
                                <th scope="col">End Date</th>
                                <th scope="col">Reason</th>
                                <th scope="col">Status</th>
                                <th scope="col">Policy Number</th>
                            </tr>
                        </thead>

                        <tbody>

                            <template for:each={loaRecords} for:item="record">

                                <tr key={record.policyId}>

                                    <td>
                                        <lightning-formatted-date-time
                                            value={record.submittedDate}
                                            year="numeric"
                                            month="short"
                                            day="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>

                                    <td>
                                        <lightning-input
                                            type="date"
                                            value={record.startDate}
                                            data-id={record.policyId}
                                            data-field="startDate"
                                            onchange={handleDateChange}
                                            disabled={record.startDateDisabled}>
                                        </lightning-input>
                                    </td>

                                    <td>
                                        <lightning-input
                                            type="date"
                                            value={record.endDate}
                                            data-id={record.policyId}
                                            data-field="endDate"
                                            onchange={handleDateChange}
                                            disabled={record.endDateDisabled}>
                                        </lightning-input>
                                    </td>

                                    <td>{record.reason}</td>

                                    <td>
                                        <span class={record.statusClass}>
                                            {record.status}
                                        </span>
                                    </td>

                                    <td>{record.policyNumber}</td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                    <template if:true={editMode}>
                        <div class="slds-var-m-top_medium slds-button-group buttons-container" role="group">
                            <template if:true={hasChanges}>
                                <lightning-button
                                    label="Save Changes"
                                    variant="brand"
                                    onclick={handleSave}>
                                </lightning-button>
                            </template>

                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                onclick={handleCancel}>
                            </lightning-button>

                        </div>
                    </template>
                </div>

            </template>
        </template>
        <!-- No Data --> 
         <template if:true={noData}> 
            <div
                class="slds-notify "
                role="alert">
                <h3>
                    No Leave of Absence records found for this member
                </h3>
            </div>
        </template> 
    </div>
    </template>
    <!-- </lightning-card> -->
</template>
