<template>
    <div class="lwc-card-list">
        <div class="search-container">
            <lightning-input type="search" onchange={handleKeyChange} class="slds-m-bottom_small searchInput" value={contractNumber} placeholder="Search contract by number or date created..."></lightning-input>
            <lightning-button onclick={newContract} label="Open contract" value="Open contract" class="newContractButton"></lightning-button>
        </div>
        <template for:each={contractList} for:item="contractObj" for:index="index">
            <div key={contractObj.Id} class="main">
            <lightning-card>
                <div class="container title-container">
                    <h3 key={contractObj.Id}>{contractObj.ContractNumber} - {contractObj.Status}</h3>
                    <div key={contractObj.Id} class='actions'>
                        <a onclick={viewRecord} data-id={contractObj.Id}>
                            <lightning-icon size='x-small' icon-name="utility:case" alternative-text="View Contract" title="View Contract"></lightning-icon>
                        </a>
                        <a onclick={editRecord} data-id={contractObj.Id}>
                            <lightning-icon size='x-small' icon-name="utility:edit" alternative-text="Edit Contract" title="Edit Contract"></lightning-icon>
                        </a>
                        <a onclick={viewOwner} data-ownerid={contractObj.OwnerId}>
                            <lightning-icon size='x-small' icon-name="utility:user" alternative-text="Contract Owner" title="Contract Owner"></lightning-icon>
                        </a>
                        <a onclick={cancelContract} data-ownerid={contractObj.OwnerId} data-id={contractObj.Id}>
                            <lightning-icon size='x-small' icon-name="utility:close" alternative-text="Cancel Contract" title="Cancel Contract"></lightning-icon>
                        </a>
                    </div>
                </div>
                <hr>
                <div key={contractObj.Id} class='container'>
                    <div key={contractObj.Id} class='column'>
                        <span>Effective Date</span>
                        <span>Paid Through Date</span>

                        
                        <!-- <span if:false={contractObj.hasInactiveDate}>Status</span> -->
                        <span if:true={contractObj.hasInactiveDate}>Inactive Date</span>
                        <span>Product Name</span>
                        <span>Reason</span>
                        <span if:true={contractObj.hasCancellationReason}>Cancellation Reason</span>
                        <span if:true={contractObj.Repriced}>Repriced</span>
                        <span>Active Members</span>
                        <span>Agent</span>
                    </div>
                    <div key={contractObj.Id} class='column'>
                        <p>
                            <lightning-formatted-date-time value={contractObj.ARC_EffectiveDate__c} year="numeric" month="numeric" day="numeric" time-zone="UTC"></lightning-formatted-date-time>
                        </p>
                        <p>{contractObj.PaidThrough}</p>
                        <p if:true={contractObj.hasInactiveDate}>
                            <lightning-formatted-date-time value={contractObj.ARC_Inactive_Date__c} year="numeric" month="numeric" day="numeric" time-zone="UTC"></lightning-formatted-date-time>
                        </p>
                        <p>{contractObj.PlanName}</p>
                        <p>{contractObj.Reason}</p>
                        <p if:true={contractObj.hasCancellationReason}>{contractObj.CancellationReason}</p>
                        <p if:true={contractObj.Repriced}>
                            {contractObj.RepricedString}
                        </p>
                        <p>{contractObj.ActMembersName}</p>
                        <p>{contractObj.Agent}</p> 
                    </div>
                </div>
            </lightning-card>
            </div>
        </template>
    </div>
</template>
