<template>
    <div class="box" if:true={activePolicy}>
        <div style="padding:20px">
            <template if:true={isAccount}>
                <template if:true={activePolicyAccount}>
                    <h1 class="bold">Active Policy</h1>
                </template>
                <template if:false={activePolicyAccount}>
                    <h1>Last Created Policy</h1>
                </template>
            </template>
            <lightning-combobox
            class="slds-combobox"
            name="Select a Year"
            label="Year"
            value={yearValue}
            placeholder={yearValue}  
            onchange={handleYearChange}
            options={yearOptions}
            style="padding:10px" ></lightning-combobox>
            <lightning-button-icon icon-name="utility:refresh" variant="border-filled" title="Refresh" onclick={getApexData} class="btnHeader mgbt-10"></lightning-button-icon>
            <h1>Family Agregator</h1>
            <template if:true={hasFamilyAgg}>
                <template for:each={familyDisplay} for:item="item">
                    <div key={item.Id}>
                        <br>
                        <a href="javascript:void(0);" onclick={item.onClick}>{item.Name} - {item.year}</a>
                        <p>Current Amount:&nbsp; 
                            <strong>
                                <lightning-formatted-number value={item.current} format-style="currency" currency-code="USD"></lightning-formatted-number>
                            </strong>
                            &nbsp;Limit Amount:&nbsp; 
                            <strong>
                                <template lwc:if={item.nolimit}>
                                    <lightning-formatted-text value="No Max Limit" ></lightning-formatted-text>
                                </template>
                                <template lwc:else>
                                    <lightning-formatted-number value={item.limit} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                </template>
                            </strong>
                        </p>
                        <lightning-progress-bar  value={item.currentPercent} size="large" variant="circular"></lightning-progress-bar>
                    </div>
                </template>
            </template>
            <template if:false={hasFamilyAgg}>
                <div class="slds-text-color_error">This program doesn't have any Family Aggregator</div>
            </template>    
        </div>
        <lightning-combobox
            name="Select a Member"
            label="Select a Member"
            value={value}
            placeholder="Select..."     
            options={options}
            onchange={handleChange}
            style="padding:10px" ></lightning-combobox>
        <template if:true={selected}>
            <div class="slds-grid slds-wrap" >
                <div class="slds-col slds-size_1-of-2" >
                    <div style="padding:20px">
                        <h1>Individual - Yearly Refresh</h1>
                        <template for:each={members} for:item="item">
                            <div key={item.Id}>
                                <br>
                                <a href="javascript:void(0);" onclick={item.onClick}>{item.Name}</a>
                                <p>Current Amount:&nbsp;
                                    <strong>
                                        <lightning-formatted-number value={item.current} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                    </strong> 
                                    &nbsp;Limit Amount:&nbsp;   
                                    <strong>
                                        <template lwc:if={item.nolimit}>
                                            <lightning-formatted-text value="No Max Limit" ></lightning-formatted-text>
                                        </template>
                                        <template lwc:else>
                                            <lightning-formatted-number value={item.limit} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                        </template>
                                    </strong>
                                </p>
                                <lightning-progress-bar value={item.currentPercent} size="large" variant="circular"></lightning-progress-bar>
                                <div for:each={item.benefitYear} for:item="benefit" key={benefit.name} sytle="margin: 2px 0px;">
                                    <span style="font-style: italic;" class="slds-text-title_bold">{benefit.name}</span>
                                    <div style="margin-top: 2px; border-radius: 10px;" class="slds-progress-bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-label="Pre-Ex previous value" role="progressbar">
                                        <span class="slds-progress-bar__value" style={benefit.styles}>
                                          <span class="slds-assistive-text"></span>
                                        </span>
                                      </div>
                                      <div style="display: flex; justify-content: space-between;">
                                          <p style="text-size: 12px;">
                                                  <lightning-formatted-number value={benefit.current} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                          &nbsp;/&nbsp;
                                              <lightning-formatted-number value={benefit.limit} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                          </p>
                                          <p style="text-size: 12px;">
                                          <lightning-formatted-date-time value={benefit.date}></lightning-formatted-date-time>
                                          </p>
                                      </div>
                                </div>
                            </div>
                        </template>
                        <template if:true={theresMembLT}>
                            <hr>
                            <h1>Individual - Lifetime</h1>
                            <template for:each={membersLongTerm} for:item="item">
                                <div key={item.Id}>
                                    <br>
                                    <a href="javascript:void(0);" onclick={item.onClick}>{item.Name}</a>
                                    <p>Current Amount:&nbsp;
                                        <strong>
                                            <lightning-formatted-number value={item.current} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                        </strong> 
                                        &nbsp;Limit Amount:&nbsp;   
                                        <strong>
                                            <template lwc:if={item.nolimit}>
                                                <lightning-formatted-text value="No Max Limit" ></lightning-formatted-text>
                                            </template>
                                            <template lwc:else>
                                                <lightning-formatted-number value={item.limit} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                            </template>
                                        </strong>
                                    </p>
                                    <lightning-progress-bar  value={item.currentPercent} size="large" variant="circular"></lightning-progress-bar>
                                </div>
                            </template>
                        </template>
                    </div>    
                </div>
                <div class="slds-col slds-size_1-of-2" >
                    <div style="padding:20px">
                        <h1>Visits - Yearly Refresh </h1>
                        <template for:each={visits} for:item="item">
                            <div key={item.Id}>
                                <br>
                                <a href="javascript:void(0);" onclick={item.onClick}>{item.Name}</a>
                                <p>Current Visits: <strong>{item.current}</strong>  Limit Visits: <strong>{item.limit}</strong></p>
                                <lightning-progress-bar  value={item.currentPercent} size="large" variant="circular"></lightning-progress-bar>
                            </div>
                        </template>
                        <template if:true={theresMembLT}>
                            <hr>
                            <h1>Visits - Long Term Refresh</h1>
                            <template for:each={visitsLongTerm} for:item="item">
                              <div key={item.Id}>
                                <br>
                                <a href="javascript:void(0);" onclick={item.onClick}>{item.Name}</a>
                                <template if:true={item.isAvailable}>
                                  <p><lightning-icon icon-name="action:approval" alternative-text="Available" title="Available" size="xx-small"></lightning-icon></p>
                                </template>
                                <template if:false={item.isAvailable}>
                                    <p><lightning-icon icon-name="action:close" alternative-text="Not Available" title="Not Available" size="xx-small" style="margin-right: 5px;"></lightning-icon> Next availability date: <strong>{item.ARC_NextAvailabilityDate__c}</strong>  </p>
                                  </template>
                              </div>
                            </template>
                        </template>
                    </div>    
                </div>
            </div>
        </template>
    </div>
    <div if:false={activePolicy} class="noPolicy">
        There are no active policy for this member
    </div>
</template>
