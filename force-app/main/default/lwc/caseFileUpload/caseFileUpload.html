<template>
    <img src={imageUrl} alt="Upload Logo" class="logo"/>
    <lightning-card title="Please upload pdf or image files using the button below." class="slds-text-body_small">
        <template if:true={caseId}>
            <div class="centered-container">
                <lightning-file-upload
                    label=""
                    accept=".pdf,.jpg,.png"
                    file-field-name="ARC_Guest_Record_fileupload__c"
                    file-field-value={encryptedToken}
                    record-id={caseId}
                    onuploadfinished={handleUploadFinished}
                    multiple>
                </lightning-file-upload>
            </div>
        </template>
        <template if:false={caseId}>
            <p class="slds-text-color_error">Error: Case ID is missing from the URL.</p>
        </template>        
    </lightning-card> 

    <!-- Success Modal -->
    <template if:true={showSuccessModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small" aria-labelledby="modal-heading-01" aria-modal="true">
            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Success</h2>
                </header>
                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <p>Files uploaded successfully!</p>
                </div>
                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={closeModal}>OK</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
