<template>
    <template if:true={hasMember}>
        <div class="member-header-card">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <div class="top-row">
                <div class="identity-block">
                    <div class="avatar">{member.initials}</div>

                    <div class="identity-content">
                        <div class="name-pill-row">
                            <div class="member-name">{safeFullName}</div>
                            <span class={relationshipClass}>{safeRelationship}</span>
                            <span class={statusClass}>{safeStatus}</span>
                        </div>

                        <div class="sub-info">
                            <span>{member.accountTypeLabel}</span>
                            <span class="dot">·</span>
                            <span>Member ID: {safeMemberId}</span>
                        </div>
                    </div>
                </div>

                <div class="header-action header-action-neutral">
                    <button class="temporary-newborn-btn" type="button" onclick={handleTemporaryNewborn}>
                        Temporary Newborn
                    </button>
                </div>

                <div class="header-action header-action-brand">
                    <button class="member-id-card-btn" type="button" onclick={handleMemberIdCard}>
                        Member ID Card
                    </button>
                </div>

                <div class="header-action header-action-icon">
                    <lightning-button-menu
                        alternative-text="More actions"
                        icon-name="utility:threedots"
                        variant="border-filled"
                        menu-alignment="right"
                        onselect={handleHeaderMenuSelect}>
                        <lightning-menu-item
                            value="sendEnrollmentLink"
                            label="Send Enrollment Link">
                        </lightning-menu-item>
                    </lightning-button-menu>
                </div>
            </div>

            <div class="data-row">
                <div class="field-box">
                    <div class="field-label">PHONE</div>
                    <div class="field-value">{safePhone}</div>
                </div>

                <div class="field-box">
                    <div class="field-label">EMAIL</div>
                    <div class="field-value">{safeEmail}</div>
                </div>

                <div class="field-box field-box-address">
                    <div class="field-label">ADDRESS</div>
                    <div class="field-value">{safeAddress}</div>
                </div>

                <div class="field-box">
                    <div class="field-label">DATE OF BIRTH</div>
                    <div class="field-value">{safeDob}</div>
                </div>

                <div class="field-box field-box-age">
                    <div class="field-label">AGE</div>
                    <div class="field-value">{safeAge}</div>
                </div>

                <div class="field-box">
                    <div class="field-label">GENDER</div>
                    <div class="field-value">{safeGender}</div>
                </div>

                <div class="field-box field-box-ssn">
                    <div class="field-label">SSN</div>
                    <div class="field-value ssn-row">
                        <span>{safeSsn}</span>
                        <button
                            class="ssn-toggle"
                            type="button"
                            onclick={handleToggleSsn}>
                            {ssnToggleLabel}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <template if:true={showEnrollmentConfirmModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="send-enrollment-link-modal-heading"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={handleCancelEnrollmentLink}
                            disabled={isConfirmEnrollmentDisabled}>
                            <lightning-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                size="small">
                            </lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>

                        <h2
                            id="send-enrollment-link-modal-heading"
                            class="slds-text-heading_medium">
                            Send Enrollment Link
                        </h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium enrollment-modal-content">
                        <template if:false={isSendingEnrollmentLink}>
                            <p>{enrollmentConfirmationMessage}</p>
                        </template>
                    
                        <template if:true={isSendingEnrollmentLink}>
                            <div class="enrollment-spinner-container">
                                <lightning-spinner alternative-text="Sending" size="small">
                                </lightning-spinner>
                            </div>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <button
                            class="slds-button slds-button_neutral"
                            type="button"
                            onclick={handleCancelEnrollmentLink}
                            disabled={isConfirmEnrollmentDisabled}>
                            Cancel
                        </button>

                        <button
                            class="slds-button slds-button_brand"
                            type="button"
                            onclick={handleConfirmEnrollmentLink}
                            disabled={isConfirmEnrollmentDisabled}>
                            Confirm
                        </button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </template>
</template>
