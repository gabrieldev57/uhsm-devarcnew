<template>
    <div class="slds-form-element__control">
        <div class="demo-only demo-only--sizing slds-grid slds-wrap">
            <div class="slds-size_1-of-2">
                <template if:true={renderPasswordInput}>
                    <lightning-input label="Create new Password" value={textValue} onfocus={handleFocus} onchange={handleInputChange} data-id="newInput" class="inputs" type="password"></lightning-input>
                </template>
                <template if:false={renderPasswordInput}>
                    <lightning-input label="Create new Password" value={textValue} onfocus={handleFocus} onchange={handleInputChange} data-id="newInput" class="inputs" type="text"></lightning-input>
                </template>
                <lightning-button-icon data-id="newView" icon-name="utility:preview" class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" alternative-text="Preview" title="See password" onclick={handleChangeType}></lightning-button-icon>
                <template if:true={newPassFocus}>
                    <div class="validate">
                        <p lwc:if={containsUsername} data-id="username" class="invalid">Password cannot contain the username</p>
                        <p data-id="lowercase" class="invalid">Lowercase letter</p>
                        <p data-id="capital" class="invalid">Uppercase letter</p>
                        <p data-id="number" class="invalid">Number</p>
                        <p data-id="special" class="invalid">Special character</p>
                        <p data-id="length" class="invalid">Minimum 8 characters</p>
                    </div>
                </template>
            </div>
            <div class="slds-size_1-of-2">
                <template if:true={renderConfirmInput}>
                    <lightning-input label="Confirm Password" value={textConfValue} onchange={handleInputChange} onfocus={handleFocus} data-id="confirmInput" class="inputs" type="password"></lightning-input>
                </template>
                <template if:false={renderConfirmInput}>
                    <lightning-input label="Confirm Password" value={textConfValue} onchange={handleInputChange} onfocus={handleFocus} data-id="confirmInput" class="inputs" type="text"></lightning-input>
                </template>
                <lightning-button-icon data-id="confirmView" icon-name="utility:preview" class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" alternative-text="Preview" title="See confirmation" onclick={handleChangeType}></lightning-button-icon>
                <template if:true={confirmPassFocus}>
                    <div class="validate">
                        <p data-id="samePass" class="invalid">Password match</p>
                    </div>
                </template>
            </div>
        </div>
    </div>
    <template if:true={blankSpace}>
        <div style="margin-bottom: 80px"></div>
    </template>

    <div class="nds-m-around_small">
        <div class="nds-grid nds-grid_align-center">
            <div class="nds-grid nds-grid_align-center nds-wrap nds-button-group-row nds-size_1-of-1 nds-medium-size_8-of-12 nds-p-horizontal_medium">
                <div class="omniscript-btn-next nds-size_12-of-12 nds-m-bottom_x-small nds-medium-size_3-of-12"><button
                        type="button" aria-label="Next Step" onclick={handleNext}
                        class="vlocity-btn nds-button nds-button_brand nds-button_stretch nds-p-around_xx-small nds-size_1-of-1"><span
                            class="btnLabel">Next</span></button></div>
            </div>
        </div>
        <div class="nds-grid nds-grid_align-center">
            <div class="nds-grid nds-grid_align-center nds-wrap nds-button-group-row nds-size_1-of-1 nds-medium-size_8-of-12 nds-p-horizontal_medium">
                <div
                    class="omniscript-btn-previous nds-size_12-of-12 nds-m-bottom_x-small nds-medium-size_3-of-12"><button
                        type="button" aria-label="Previous Step" onclick={handlePrev}
                        class="vlocity-btn nds-button nds-button_neutral nds-button_stretch nds-p-around_xx-small nds-size_1-of-1"><span
                            class="btnLabel">Previous</span></button></div>
            </div>
        </div>
    </div>
    <div style="margin-bottom:-30px;"></div>
</template>
