<template>
    <div class="container">
        <template if:true={employer}>
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-large-size_12-of-12 ">
                    <div class="slds-grid slds-wrap header-container">
                        <div class=" slds-col slds-size_2-of-12 slds-large-size_1-of-12">
                            <lightning-icon icon-name="utility:company" size="small"></lightning-icon>
                        </div>
                        <div class="header slds-col slds-size_10-of-12 slds-medium-size_10-of-12 slds-large-size_11-of-12 slds-var-p-top_x-small">
                            Company Details
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-row-container">
                <lightning-input required={isRequired} label="Company Name" type="text" name="Name"
                    value={employer.Name} disabled={isReadOnly} class="form-row-item" onchange={handleFieldChange}>
                </lightning-input>
                <lightning-input label="Federal Tax ID" type="text" name="ARC_FederalEmployerTaxIDNumber__c" value={employer.ARC_FederalEmployerTaxIDNumber__c} 
                class="form-row-item" maxlength="10" disabled>
                </lightning-input>
            </div>
            <div>
                <lightning-input label="SIC Code" type="text" name="SICCodeDisplay"
                    value={sicDisplayValue} disabled>
                </lightning-input>
            </div>
            <!-- <template if:true={isReadOnly}>
                <lightning-input label="SIC Code" type="text" name="SICCode"
                    value={SIC} disabled>
                </lightning-input>
            </template> -->
            <!-- <template if:false={isReadOnly}>
                <div class="form-row-container">
                    <lightning-input label="SIC" type="text" name="SIC" required={isRequired}
                        value={employer.Sic} class="form-row-item" onchange={handleFieldChange}>
                    </lightning-input>
                    <lightning-input  label="SIC Description" type="text" name="SICDescription" required={isRequired}
                        value={employer.SicDesc} class="form-row-item" onchange={handleFieldChange}>
                    </lightning-input>
                </div>
            </template> -->
            <label class="slds-form-element__label">Address</label>
                <lightning-formatted-rich-text label="Address" type="text" name="Address"
                    value={employer.vlocity_ins__CalculatedAddress__c} disabled class="address-display">
                </lightning-formatted-rich-text>
            <!--<lightning-input label="Invoice Email" type="email" name="vlocity_ins__Email__c"
                value={employer.vlocity_ins__Email__c} disabled onchange={handleFieldChange}>
            </lightning-input>-->
        </template>
    </div>
</template>
