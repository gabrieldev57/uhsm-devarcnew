<template>
    <template lwc:if={isOpen}>
        <!-- Modal Backdrop -->
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header -->
                <div class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        class="slds-modal__close"
                        onclick={handleCancel}>
                    </lightning-button-icon>
                    <h1 class="slds-modal__title slds-hyphenate">{modalTitle}</h1>
                </div>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Legal Name -->
                    <div class="slds-m-bottom_medium">
                        <lightning-input
                            type="text"
                            label="Legal Name"
                            name="legalName"
                            value={entityData.legalName}
                            required
                            onchange={handleFieldChange}>
                        </lightning-input>
                    </div>

                    <!-- Federal Tax ID -->
                    <div class="slds-m-bottom_medium">
                        <lightning-input
                            type="text"
                            label="Federal Tax ID"
                            name="federalTaxId"
                            value={entityData.federalTaxId}
                            placeholder="XX-XXXXXXX"
                            pattern="[0-9]{2}-[0-9]{7}"
                            maxlength="10"
                            message-when-pattern-mismatch="Please enter a valid Tax ID in format XX-XXXXXXX"
                            required
                            onkeyup={handleFederalTaxIdKeyUp}
                            onchange={handleFieldChange}>
                        </lightning-input>
                    </div>

                    <!-- Number of Employees -->
                    <div class="slds-m-bottom_medium">
                        <lightning-input
                            type="number"
                            label="Number of Employees"
                            name="numberOfEmployees"
                            value={entityData.numberOfEmployees}
                            min="0"
                            onchange={handleFieldChange}>
                        </lightning-input>
                    </div>
                </div>

                <!-- Footer -->
                <div class="slds-modal__footer">
                    <lightning-button 
                        label="Cancel" 
                        onclick={handleCancel}>
                    </lightning-button>
                    <lightning-button 
                        variant="brand" 
                        label={saveButtonLabel}
                        class="slds-m-left_x-small"
                        onclick={handleSave}>
                    </lightning-button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
