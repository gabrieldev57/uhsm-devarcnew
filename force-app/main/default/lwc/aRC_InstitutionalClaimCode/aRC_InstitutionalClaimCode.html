<template>
    <template if:true={isLoading}>
        <div class="spinnerDiv">
            <lightning-spinner alternative-text="Loading" size="medium" class="spinner"></lightning-spinner>
        </div>
    </template>
    <template if:false={isLoading}>      
            <lightning-record-edit-form object-api-name="Claim" record-id={recordId}  onsubmit={handleSuccess} 
            onerror={handleError}>
                <div>
                    <lightning-button
                        class="slds-m-top_small"
                        variant="brand"
                        type="submit"
                        name="update"
                        label="Save"
                    ></lightning-button>
                </div>
                <div class="slds-grid">
                    <div onmouseleave={handleMouseout} onmouseenter={handleMouseover} style="width: 100%;" data-code="admit">
                        <lightning-input-field field-name="ARC_AdmitDX_Code__c" class="slds-col slds-size_1-of-2" style="width: 100%;" data-code="admit" onchange={handleChangeCode}></lightning-input-field>
                        <div style="display:none;position: absolute;opacity:0" data-display="admit">
                            <c-a-r-c_-compact-layout-on-hover record-id={admitCode} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                        </div>
                    </div>
                    <div onmouseleave={handleMouseout} onmouseenter={handleMouseover} style="width: 100%;" data-code="drg">
                        <lightning-input-field field-name="ARC_Submitted_DRG_Code__c" class="slds-col slds-size_1-of-2" style="width: 100%;" data-code="drg" onchange={handleChangeCode}></lightning-input-field>
                        <div style="display:none;position: absolute;opacity:0" data-display="drg">
                            <c-a-r-c_-compact-layout-on-hover record-id={drgCode} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                        </div>
                    </div>
                </div>
                <div class="slds-grid">
                    <lightning-input-field field-name="ARC_PPS_Code__c" class="slds-col slds-size_1-of-2"></lightning-input-field>
                    <lightning-input-field field-name="ARC_Calculated_DRG_Code__c" class="slds-col slds-size_1-of-2"></lightning-input-field>
                </div>
                <div class="slds-grid">
                    <div onmouseleave={handleMouseout} onmouseenter={handleMouseover} style="width: 100%;" data-code="principal">
                        <lightning-input-field field-name="ARC_Principal_Procedure__c" class="slds-col slds-size_1-of-2" style="width: 100%;" data-code="principal" onchange={handleChangeCode}></lightning-input-field>
                        <div style="display:none;position: absolute;opacity:0" data-display="principal">
                            <c-a-r-c_-compact-layout-on-hover record-id={principalCode} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                        </div>
                    </div>
                    <lightning-input-field field-name="ARC_Principal_Procedure_Date__c" class="slds-col slds-size_1-of-2"></lightning-input-field>
                </div>            
            </lightning-record-edit-form>
            <template for:each={data} for:item="code">
                <div key={code.Id} class="slds-grid">					
                    <p>{code.Name}</p>  
                </div>
            </template>
            <!--New Button-->
            <br>
            <lightning-button
                class="slds-m-top_small"
                variant="brand"
                type="New"
                name="new"
                label="New Code"
                onclick={handleNew}
            ></lightning-button>
            <br>
            <!-- Modal start -->      
            <template if:true={isShowModal}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <!-- modal header start -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideForms}>
                                <lightning-icon icon-name="utility:close"
                                alternative-text="close"
                                variant="inverse"
                                size="small" ></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New Code</h2>
                        </header>
                    
                        <!-- modal body start -->
                        <div class="slds-modal__content slds-p-around_medium"  style="height:400px; position:relative;" id="modal-content-id-1" >
                        <lightning-combobox
                            name="field"
                            label="Select the type of Field to create"
                            value={value}
                            options={options}
                            onchange={handleChange} ></lightning-combobox>
                        
                        <!--Form to create Claim Code-->
                            <template if:true={isShowForm}>
                                <lightning-record-edit-form object-api-name="ARC_Institutional_Claim_Code__c" onsuccess={successInstClaimCov} onerror={errorInstClaimCov}>
                                    <div class="slds-grid">
                                        <!-- Hidden fields -->
                                        <lightning-input-field field-name="Name" value="Manual generated" style="display: none;"></lightning-input-field>
                                        <lightning-input-field field-name="ARC_Institutional_Claim__c" value={recordId} style="display: none;"></lightning-input-field>
                                        <lightning-input-field field-name="RecordTypeId" value={selectedRecordType} style="display: none;"></lightning-input-field>
                                        

                                        <!--Condition Code Fields-->
                                        <template if:true={conditionCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_ConditionCode__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                        <!--Occurrence Code Fields-->
                                        <template if:true={occCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_Occurrence_Code__c" required></lightning-input-field>
                                                <lightning-input-field field-name="ARC_Date__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                         <!--Occurrence Span Code Fields-->
                                         <template if:true={occSpanCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_Occurrence_Span_Code__c" required></lightning-input-field>
                                            </div>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_Date_From__c" required></lightning-input-field>
                                                <lightning-input-field field-name="ARC_Date_Through__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                         <!--E-Code Fields-->
                                         <template if:true={eCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_ECode__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                         <!--ICD DX Code Fields-->
                                         <template if:true={icdCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <!-- <div onmouseleave={handleMouseout} onmouseenter={handleMouseover} style="width: 100%;" data-code="icd">
                                                    <lightning-input-field field-name="ARC_ICD_DX__c" class="slds-col slds-size_1-of-2" style="width: 100%;" data-code="admit" onchange={handleChangeCode}></lightning-input-field>
                                                    <div style="display:none;position: absolute;opacity:0" data-display="admit">
                                                        <c-a-r-c_-compact-layout-on-hover record-id={admitCode} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                                                    </div>
                                                </div> -->
                                                test
                                                <lightning-input-field field-name="ARC_ICD_DX__c" required></lightning-input-field>
                                                <lightning-input-field field-name="ARC_POA__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                         <!--Other Procedure Code Fields-->
                                         <template if:true={otherCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_Other_Procedure_Code__c" required></lightning-input-field>
                                                <lightning-input-field field-name="ARC_Date__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                         <!--Patient DX Code Fields-->
                                         <template if:true={patientCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_Patient_DX__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                        <!--Value and Amount Code Fields-->
                                        <template if:true={valueCodeForm}>
                                            <div class="slds-col slds-size_1-of-2">
                                                <lightning-input-field field-name="ARC_Vale_Codes__c" required></lightning-input-field>
                                                <lightning-input-field field-name="ARC_Amount__c" required></lightning-input-field>
                                            </div>
                                        </template>
                                        
                                    </div>

                                    <div id="footerSection" style="padding-top:110px; " >                                                             
                                        <div class="slds-modal__footer">
                                            <button class="slds-button slds-button_neutral" onclick={hideForms} data-id="close">Cancel</button>
                                            <button type="submit" class="slds-button slds-button_brand">Create</button>
                                        </div>
                                    </div>
                                    
                                </lightning-record-edit-form>    
                            </template>              
                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
             <!-- Modal ends -->
           <template if:true ={isConditionCode}>
            <template if:false = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={conditionCodeColumn}
                            data={conditionCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <template if:true = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={conditionCodeColumnCU}
                            data={conditionCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <br>
        </template>


        <template if:true ={isOccurenceCode}>
            <template if:false = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={occCodeColumn}
                            data={occCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <template if:true = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={occCodeColumnCU}
                            data={occCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
             </template>
            <br>
        </template>


        <template if:true ={isOccSpanCode}>
            <template if:false = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={occSpanCodeColumn}
                            data={occSpanCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <template if:true = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={occSpanCodeColumnCU}
                            data={occSpanCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <br>
        </template>


        <template if:true ={isECode}>
            <template if:false ={isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <div class="table-idx">
                        <div class="row-idx header-idx">
                          <div class="cell-idx"></div>
                          <div class="cell-idx">E-CODE</div>
                          <div class="cell-idx"></div>
                        </div>
                        <div class="row-idx" for:each={eCodeData} for:item="code" key={code.Id}>
                          <div class="cell-idx">{code.index}</div>
                          <div class="cell-idx" onmouseleave={handleMouseout} onmouseenter={handleMouseover} data-item={code.Id}>
                            <div><h1>{code.ARC_ECode__c}</h1></div>
                            <div style="display:none;position: absolute;opacity:0" data-display={code.Id}>
                                <c-a-r-c_-compact-layout-on-hover record-id={code.ARC_ECode__r.Id} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                            </div>
                        </div>
                          <div class="cell-idx">
                            <lightning-button-menu alternative-text="Show menu" icon-size="x-small">
                                <lightning-menu-item value="delete" label="Delete" onclick={handleDelete} data-id={code.Id}></lightning-menu-item>
                            </lightning-button-menu>
                          </div>
                        </div>
                      </div>
                </div>
            </template>
            <template if:true ={isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <div class="table-idx">
                        <div class="row-idx header-idx">
                          <div class="cell-idx"></div>
                          <div class="cell-idx">E-CODE</div>
                          <div class="cell-idx"></div>
                        </div>
                        <div class="row-idx" for:each={eCodeData} for:item="code" key={code.Id}>
                          <div class="cell-idx">{code.index}</div>
                          <div class="cell-idx" onmouseleave={handleMouseout} onmouseenter={handleMouseover} data-item={code.Id}>
                            <div><h1>{code.ARC_ECode__c}</h1></div>
                            <div style="display:none;position: absolute;opacity:0" data-display={code.Id}>
                                <c-a-r-c_-compact-layout-on-hover record-id={code.ARC_ECode__r.Id} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                            </div>
                        </div>
                          <div class="cell-idx">
                            <!-- <lightning-button-menu alternative-text="Show menu" icon-size="x-small">
                                <lightning-menu-item value="delete" label="Delete" onclick={handleDelete} data-id={code.Id}></lightning-menu-item>
                            </lightning-button-menu> -->
                          </div>
                        </div>
                      </div>
                </div>
            </template>
            <br>
        </template>


        <template if:true ={isICDCode}>
            <template if:false ={isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <!-- <lightning-datatable
                            key-field="Id"
                            columns={icdDxCodeColumn}
                            data={icdCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable> -->

                    <div class="table-idx">
                        <div class="row-idx header-idx">
                          <div class="cell-idx"></div>
                          <div class="cell-idx">ICD DX</div>
                          <div class="cell-idx">POA</div> 
                          <div class="cell-idx"></div>
                        </div>
                        <div class="row-idx" for:each={icdCodeData} for:item="code" key={code.Id}>
                          <div class="cell-idx">{code.index}</div>
                          <div class="cell-idx" onmouseleave={handleMouseout} onmouseenter={handleMouseover} data-item={code.Id}>
                            <div><h1>{code.ARC_ICD_DX__c}</h1></div>
                            <div style="display:none;position: absolute;opacity:0" data-display={code.Id}>
                                <c-a-r-c_-compact-layout-on-hover record-id={code.ARC_ICD_DX__r.Id} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                            </div>
                        </div>
                          <div class="cell-idx">{code.ARC_POA__c}</div>
                          <div class="cell-idx">
                            <lightning-button-menu alternative-text="Show menu" icon-size="x-small">
                                <lightning-menu-item value="delete" label="Delete" onclick={handleDelete} data-id={code.Id}></lightning-menu-item>
                            </lightning-button-menu>
                          </div>
                        </div>
                      </div>
                </div>
            </template>
            <template if:true ={isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <!-- <lightning-datatable
                            key-field="Id"
                            columns={icdDxCodeColumnCU}
                            data={icdCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable> -->

                    <div class="table-idx">
                        <div class="row-idx header-idx">
                          <div class="cell-idx"></div>
                          <div class="cell-idx">ICD DX</div>
                          <div class="cell-idx">POA</div> 
                          <div class="cell-idx"></div>
                        </div>
                        <div class="row-idx" for:each={icdCodeData} for:item="code" key={code.Id}>
                          <div class="cell-idx">{code.index}</div>
                          <div class="cell-idx" onmouseleave={handleMouseout} onmouseenter={handleMouseover} data-item={code.Id}>
                            <div><h1>{code.ARC_ICD_DX__c}</h1></div>
                            <div style="display:none;position: absolute;opacity:0" data-display={code.Id}>
                                <c-a-r-c_-compact-layout-on-hover record-id={code.ARC_ICD_DX__r.Id} layout-name="Code Details"></c-a-r-c_-compact-layout-on-hover>
                            </div>
                        </div>
                          <div class="cell-idx">{code.ARC_POA__c}</div>
                          <div class="cell-idx">
                            <!-- <lightning-button-menu alternative-text="Show menu" icon-size="x-small">
                                <lightning-menu-item value="delete" label="Delete" onclick={handleDelete} data-id={code.Id}></lightning-menu-item>
                            </lightning-button-menu> -->
                          </div>
                        </div>
                      </div>
                </div>
            </template>
            <br>
        </template>

        <template if:true ={isOtherCode}>
            <template if:false = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={otherCodeColumn}
                            data={otherCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <template if:true = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={otherCodeColumnCU}
                            data={otherCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <br>
        </template>

        <template if:true ={isPatienDx}>
            <template if:false = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={patientDxCodeColumn}
                            data={patientDxCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <template if:true = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={patientDxCodeColumnCU}
                            data={patientDxCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <br>
        </template>

        <template if:true ={isValueCode}>
            <template if:false = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={valueCodeColumn}
                            data={valeCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
            <template if:true = {isClaimUser}>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-datatable
                            key-field="Id"
                            columns={valueCodeColumnCU}
                            data={valeCodeData}
                            onsave={saveHandleAction}
                            hide-checkbox-column
                            onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
            </template>
        </template>

    </template>


</template>
