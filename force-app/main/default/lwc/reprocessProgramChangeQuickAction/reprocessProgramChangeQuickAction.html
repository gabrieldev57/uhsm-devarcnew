<template>
    <lightning-card title="Reprocess Program Change">
        <div class="slds-p-around_medium">
            <lightning-button 
                variant="brand" 
                label="Run Reprocess" 
                onclick={handleClick}
                disabled={isLoading}>
            </lightning-button>

            <template if:true={isLoading}>
                <lightning-spinner size="small"></lightning-spinner>
            </template>

            <template if:true={message}>
                <p class="slds-m-top_medium">{message}</p>
            </template>
        </div>
    </lightning-card>
</template>
