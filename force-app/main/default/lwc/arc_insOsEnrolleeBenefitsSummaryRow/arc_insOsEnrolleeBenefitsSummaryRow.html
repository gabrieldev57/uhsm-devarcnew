<template>
    <div
        class="product-card slds-box slds-grid slds-wrap slds-p-around_none slds-m-horizontal_medium slds-m-vertical_medium">
        <div class="product-detail slds-size_3-of-4 slds-p-around_large">
            <div if:true={product.Type__c} class="slds-p-bottom_small slds-text-body_regular slds-truncate labelsSameStyle">
                {product.Type__c}
            </div>
            <div class="slds-text-heading_medium text-bold labelsSameStyle" onclick={openDetailsProduct}>{product.Name}</div>
            <vlocity_ins-button theme={theme} variant="base" label={labels.InsPlanDetails}
                icon-name="standard:customer_portal_users" onclick={openDetailsProduct}>Program Details</vlocity_ins-button>
            <div if:true={product.Description} class="vloc-ins-covered-people nds-m-top_xx-small slds-m-top_xx-small">
                {product.Description}
            </div>
            <div class="slds-m-top_medium">
                <div class="text-bold slds-text-body_regular labelsSameStyle">
                    {labels.InsWhosCovered}
                </div>
                <div class="covered-people slds-text-title_bold labelsSameStyle">
                    {dependentNames}
                </div>
            </div>
        </div>
        <div class="vloc-ins-bold slds-text-heading_medium slds-align_absolute-center slds-col slds-size_1-of-4 labelsSameStyle">
            <lightning-formatted-number value={price} format-style="currency" minimum-fraction-digits="2"
                maximum-fraction-digits="2"></lightning-formatted-number>/{labels.InsMonthAbrv}
        </div>
    </div>
</template>
