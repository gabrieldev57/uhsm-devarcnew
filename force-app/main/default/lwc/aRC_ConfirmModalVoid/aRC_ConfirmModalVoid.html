<template>
    <lightning-modal-header label="Confirm Void"></lightning-modal-header>

    <lightning-modal-body>
        <p class="slds-text-align_center">
            Are you sure you want to void case <strong>{caseNumber}</strong>?
        </p>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
        <lightning-button variant="brand" label="Confirm" onclick={handleConfirm}></lightning-button>
    </lightning-modal-footer>
</template>
