<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid">
             <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small slds-truncate">Members</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="memberTableSG_cardBody slds-card__body">
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-is-relative">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={hasMembers}>
                <div class="table-container">
                    
                    <template if:true={hasActiveMembers}>
                        <div class="section-headerAM slds-grid slds-border_bottom slds-p-bottom_x-small slds-text-title_caps slds-text-color_weak">
                            ACTIVE MEMBERS
                        </div>
                        
                        <template for:each={activeMemberList} for:item="member">
                            <div key={member.memberId} class="member-block">
                                <div class="slds-grid member-header-row slds-p-horizontal_medium">
                                    <div class="slds-col slds-size_3-of-12 label-text">NAME</div>
                                    <div class="slds-col slds-size_3-of-12 label-text">RELATIONSHIP</div>
                                    <div class="slds-col slds-size_2-of-12 label-text">SSN</div>
                                    <div class="slds-col slds-size_2-of-12 label-text">DOB</div>
                                    <div class="slds-col slds-size_2-of-12 label-text">AGE</div>
                                </div>
                                
                                <div class="slds-grid member-value-row slds-p-horizontal_medium slds-m-bottom_small">
                                    <div class="slds-col slds-size_3-of-12">
                                        <div class="value-text fw-bold">
                                            <a href="javascript:void(0);" data-id={member.Id} onclick={navigateToRecordPage}>{member.FullName}</a>
                                        </div>
                                        <div class="sub-text">{member.Email}</div>
                                    </div>
                                    <div class="slds-col slds-size_3-of-12">
                                        <span class="badge-relationship">{member.Relationship}</span>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 value-text">{member.SSN}</div>
                                    <div class="slds-col slds-size_2-of-12 value-text">{member.DOB}</div>
                                    <div class="slds-col slds-size_2-of-12 value-text">{member.Age}</div>
                                </div>

                                <div class="plans-container">
                                    <div class="slds-grid plan-header-row">
                                        <div class="slds-col slds-size_3-of-12 label-text">PLAN</div>
                                        <div class="slds-col slds-size_3-of-12 label-text">COVERAGE PRIMARY</div>
                                        <div class="slds-col slds-size_2-of-12 label-text">ACTIVE DATE</div>
                                        <div class="slds-col slds-size_2-of-12 label-text">INACTIVE DATE</div>
                                        <div class="slds-col slds-size_2-of-12 label-text">STATUS</div>
                                    </div>
                                    <template for:each={member.plans} for:item="plan">
                                        <div key={plan.planId} class="slds-grid plan-row">
                                            <div class="slds-col slds-size_3-of-12 plan-name">{plan.PlanName}</div>
                                            <div class="slds-col slds-size_3-of-12 value-text">{plan.CoveragePrimaryMember}</div>
                                            <div class="slds-col slds-size_2-of-12 value-text">{plan.MemberStartDate}</div>
                                            <div class="slds-col slds-size_2-of-12 value-text">{plan.MemberEndDate}</div>
                                            <div class="slds-col slds-size_2-of-12 status-cell">
                                                <span class={plan.statusClass}></span>
                                                {plan.status}
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:true={hasInactiveMembers}>
                        <div class="section-headerIM slds-grid slds-border_bottom slds-p-bottom_x-small slds-text-title_caps slds-text-color_weak">
                            INACTIVE MEMBERS
                        </div>
                        <template for:each={inactiveMemberList} for:item="member">
                            <div key={member.memberId} class="member-block">
                                <div class="slds-grid member-header-row slds-p-horizontal_medium">
                                    <div class="slds-col slds-size_3-of-12 label-text">NAME</div>
                                    <div class="slds-col slds-size_3-of-12 label-text">RELATIONSHIP</div>
                                    <div class="slds-col slds-size_2-of-12 label-text">SSN</div>
                                    <div class="slds-col slds-size_2-of-12 label-text">DOB</div>
                                    <div class="slds-col slds-size_2-of-12 label-text">AGE</div>
                                </div>
                                <div class="slds-grid member-value-row slds-p-horizontal_medium slds-m-bottom_small">
                                    <div class="slds-col slds-size_3-of-12">
                                        <div class="value-text fw-bold">
                                            <a href="javascript:void(0);" data-id={member.Id} onclick={navigateToRecordPage}>{member.FullName}</a>
                                        </div>
                                        <div class="sub-text">{member.Email}</div>
                                    </div>
                                    <div class="slds-col slds-size_3-of-12">
                                        <span class="badge-relationship">{member.Relationship}</span>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 value-text">{member.SSN}</div>
                                    <div class="slds-col slds-size_2-of-12 value-text">{member.DOB}</div>
                                    <div class="slds-col slds-size_2-of-12 value-text">{member.Age}</div>
                                </div>

                                <div class="plans-container">
                                    <div class="slds-grid plan-header-row">
                                        <div class="slds-col slds-size_3-of-12 label-text">PLAN</div>
                                        <div class="slds-col slds-size_3-of-12 label-text">COVERAGE PRIMARY</div>
                                        <div class="slds-col slds-size_2-of-12 label-text">ACTIVE DATE</div>
                                        <div class="slds-col slds-size_2-of-12 label-text">INACTIVE DATE</div>
                                        <div class="slds-col slds-size_2-of-12 label-text">STATUS</div>
                                    </div>
                                    <template for:each={member.plans} for:item="plan">
                                        <div key={plan.planId} class="slds-grid plan-row">
                                            <div class="slds-col slds-size_3-of-12 plan-name">{plan.PlanName}</div>
                                            <div class="slds-col slds-size_3-of-12 value-text">{plan.CoveragePrimaryMember}</div>
                                            <div class="slds-col slds-size_2-of-12 value-text">{plan.MemberStartDate}</div>
                                            <div class="slds-col slds-size_2-of-12 value-text">{plan.MemberEndDate}</div>
                                            <div class="slds-col slds-size_2-of-12 status-cell">
                                                <span class={plan.statusClass}></span>
                                                {plan.status}
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <template if:false={hasMembers}>
                <div class="slds-p-around_large slds-text-align_center slds-text-color_weak">
                    No members found.
                </div>
            </template>
        </div>
    </article>
</template>
