<template>
    <div class="nds-form-element nds-form-container" data-id="contInput">
        <div class="nds-form-element__control nds-form-element__control-animated-label">
            <input onchange={handleInputChange} class="vlocity-input nds-input nds-input_mask" data-id="ssnInpt"
                maxlength="9" minlength="9" type={inputType} required aria-invalid="false">
                <lightning-button-icon data-id="fieldView" icon-name="utility:preview"
                    class="slds-input__icon slds-input__icon_right viewIcon" alternative-text="View"
                    title="View" onclick={handleChangeType}></lightning-button-icon>
                    

            <div class="nds-form-element__label nds-align-middle nds-animated-label__ease-out">
                <label for="input1-2767" data-label="true">Social Security Number<abbr
                        class="nds-required nds-p-left_xx-small" title="Required">*</abbr></label>
                <slot name="label">
                </slot>
            </div>
            <div class="errInput" if:true={errorInput}>Error:&nbsp; {errorMessage}</div>
        </div>
    </div>

</template>
