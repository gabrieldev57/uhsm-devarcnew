<template>
    <lightning-spinner lwc:if={isLoading} alternative-text="Loading" size="medium"></lightning-spinner>
    
    <div class="header">
        <h2>Census Member CSV Upload</h2>
        <p class="subheader">Upload a CSV file to create and manage Census Members and Person Accounts.</p>
        
        <!-- Census Stats -->
        <template lwc:if={hasCensus}>
            <div class="slds-box slds-theme_shade slds-m-top_small">
                <p><strong>Current Census Members:</strong> {memberCount}</p>
            </div>
        </template>
    </div>

    <!-- CSV Upload Section -->
    <div class="input-section slds-m-top_medium">
        <lightning-input 
            type="file" 
            label="Upload Census CSV File" 
            accept=".csv" 
            onchange={handleFileChange}
        ></lightning-input>
        
        <template lwc:if={files.length}>
            <ul class="slds-m-top_medium">
                <template for:each={files} for:item="file">
                    <li key={file.name} class="slds-m-bottom_x-small slds-grid">
                        <span class="slds-col">{file.name}</span>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Remove"
                            title="Remove file"
                            onclick={handleRemove}
                            data-name={file.name}
                            class="slds-col_bump-left"
                        ></lightning-button-icon>
                    </li>
                </template>
            </ul>
        </template>
    </div>

    <!-- Error Display Section -->
    <template lwc:if={hasErrors}>
        <div class="slds-m-top_medium">
            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                <h2 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="utility:error" size="small" class="slds-m-right_x-small"></lightning-icon>
                    Validation Errors Found ({validationErrors.length})
                </h2>
                <div class="slds-text-body_small">
                    <p class="slds-m-bottom_small"><strong>Please fix the following issues in your CSV file:</strong></p>
                    <ul class="slds-list_dotted">
                        <template for:each={validationErrors} for:item="error">
                            <li key={error} class="slds-m-bottom_xx-small error-item">{error}</li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </template>

    <!-- CSV Preview -->
    <template lwc:if={showPreview}>
        <div class="slds-m-top_large">
            <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                <h3 class="slds-text-heading_small">CSV Preview</h3>
                <lightning-button 
                    variant="brand" 
                    label="Process CSV" 
                    onclick={handleCreateRecords}
                    disabled={isLoading}
                ></lightning-button>
            </div>
            <p class="slds-text-body_small slds-m-bottom_small">
                <strong>Note:</strong> The system will create new members, update existing members (matched by SSN), 
                and delete members not present in the CSV.
            </p>
            <lightning-datatable 
                key-field="SSN" 
                data={csvData} 
                columns={columns} 
                hide-checkbox-column="true"
            ></lightning-datatable>
        </div>
    </template>
</template>
