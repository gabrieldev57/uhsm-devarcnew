<template>
    <article class="slds-card">
        <div class="slds-card__body slds-card__body_inner">
            <!-- Path Starts Here -->
            <div class="slds-path slds-path_has-coaching">
                <div class="slds-grid slds-path__track">
                    <div class="slds-grid slds-path__scroller-container scroller-container__helper">
                        <!-- Actual Path for Status -->
                        <div class="slds-path__scroller uiScroller scroller-wrapper scroll-horizontal scroller-wrapper__helper">
                            <div class="slds-path__scroller_inner scroller scroller-inner__helper">
                                <lightning-progress-indicator current-step={caseStatus} type="path" variant="base">
                                    <template for:each={steps} for:item="step">
                                        <lightning-progress-step label={step.label} title={step.label} value={step.value} key={step.label} onclick={handlePathSelect}></lightning-progress-step>
                                    </template>
                                </lightning-progress-indicator>
                            </div>
                        </div>
                        <!-- Control Buttons for Mobile/Small Screens -->
                        <div class="slds-path__scroll-controls">
                            <button type="button" name="leftScrollButton" onclick={handleStatusScroll} class="slds-button--neutral slds-button slds-button_icon slds-button_icon-border-filled uiButton">
                                <lightning-icon icon-name="utility:left" size="xx-small" variant="inverse" class="slds-icon-utility-left slds-button__icon slds-icon_container forceIcon"></lightning-icon>
                            </button>
                            <button type="button" name="rightScrollButton" onclick={handleStatusScroll} class="slds-button--neutral slds-button slds-button_icon slds-button_icon-border-filled uiButton">
                                <lightning-icon icon-name="utility:right" size="xx-small" variant="inverse" class="slds-icon-utility-right slds-button__icon slds-icon_container forceIcon"></lightning-icon>
                            </button>
                        </div>
                    </div>
                    <!-- Status Change Button -->
                    <div class="slds-grid slds-path__action">
                        <button type="button" onclick={handleStatusChange} class="slds-button slds-button--brand slds-path__mark-complete stepAction current uiButton">
                            <template if:true={buttonLoading}>
                                <lightning-spinner alternative-text="Loading" variant="brand" size="medium"></lightning-spinner>
                            </template>
                            <lightning-icon if:true={buttonIcon} icon-name="utility:check" size="xx-small" variant="inverse" class="slds-icon-utility-check stepActionIcon slds-button__icon slds-button__icon--left slds-icon_container"></lightning-icon>
                            <span class="uiOutputText">{buttonText}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </article>

    <template if:true={closedSelection}>
        <!-- Modal/Popup Box for Closed Status Starts Here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="modal-container slds-modal__container">
                <!-- Modal/Popup Box Header Starts Here -->
                <div class="modal-header slds-modal__header">
                    <h2 id="modal-heading-01" class="title slds-text-heading--medium slds-hyphenate">{closedModalHeader}</h2>
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close this window" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="Close this window"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close this window</span>
                    </button>
                </div>
                <!-- Modal/Popup Box Body Starts Here -->
                <div class="modal-body scrollable slds-modal__content slds-p-around--medium modal-content__helper">
                    <div class="slds-p-around_large" >
                        <div class="uiInput uiInputSelect uiInput--default uiInput--select">
                            <lightning-combobox
                                class="uiInput uiInputSelect uiInput--default uiInput--select"
                                label="Status"
                                placeholder="Select a closed stage..."
                                options={closedOptions}
                                onchange={closedStatusSelected}
                                required
                            ></lightning-combobox>
                        </div>
                    </div>
                </div>
                <!-- Modal/Popup Box Footer Starts Here -->
                <div class="modal-footer slds-modal__footer">
                    <div class="forceModalActionContainer--footerAction forceModalActionContainer">
                        <button class="slds-button slds-button--neutral uiButton forceActionButton" onclick={closeModal} title="Cancel">Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={handleClosedStatusChange} title="Save">Save</button>
                    </div>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
