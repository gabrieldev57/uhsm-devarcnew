<template>
    <div class="master-container">
        
        <div class="form-container" lwc:if={unfinished}>
            <div class="header">
                <lightning-icon icon-name="utility:coupon_codes" 
                 size="small"></lightning-icon>
                 <h2>Submit Support Request</h2>
            </div>
        <lightning-spinner if:true={isLoading} alternative-text="Loading"></lightning-spinner>
        <form onsubmit={avoidRefresh}>
            <lightning-combobox name="inputType" label="Input Type" value={inputTypeDefaultValue} options={inputTypeOptions}
                            onchange={handleInputTypeChange} required>
            </lightning-combobox>

            <template if:true={isSelectEmployeeDisabled}>
                <lightning-combobox name="employeeId" label="Select Employee" value={selectedEmployeeId} options={selectEmployeeOptions}
                            placeholder="Select Employee" required={makeSelectEmployeeRequired}
                            onchange={handleSelectEmployeeChange}>
                </lightning-combobox>
            </template>

            <lightning-input type="text" name="subject" label="Subject" required="true" onchange={handleChange} placeholder="Brief description of issue"></lightning-input>

            <lightning-textarea name="description" label="Description" required="true" onchange={handleChange} placeholder="Provide detailed information about your issue or question"></lightning-textarea>
            <div class="user-information">
                <p>Your Contact Information</p>
                <p>Your case will be automatically assigned using your profile Information</p>
                <p><strong>Name: </strong> {user.Name}</p>
                <p><strong>Email: </strong> {user.Email}</p>
                <p><strong>Company: </strong> {user.Company}</p>

            </div>
            <button type="submit" class="submit-button" onclick={handleSubmit}>
                <lightning-icon icon-name="utility:coupon_codes" variant="inverse" 
                 size="x-small"></lightning-icon>Submit Request
            </button>
        </form>

    </div>
    <div class="finish-screen" lwc:else>
        <lightning-icon icon-name="utility:success" size="large" alternative-text="success"></lightning-icon>
        <h2>Thank you for submitting your request!</h2>
        <p>We will get back to you as soon as possible.</p>
        <button class="submit-button" onclick={handleNewRequest} >Submit New Request</button>

    </div>

    </div>
</template>
