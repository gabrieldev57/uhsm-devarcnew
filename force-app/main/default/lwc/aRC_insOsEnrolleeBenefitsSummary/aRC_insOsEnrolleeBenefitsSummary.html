<template>
    <template if:false={isLoaded}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
    <template if:true={plans}>
        <template for:each={productlist} for:item="plan">
            <c-arc_ins-os-enrollee-benefits-summary-row key={plan.selectedProduct.Id}
                class="nds-p-horizontal_x-small slds-p-horizontal_x-small" product={plan.selectedProduct} dependents={plan.userInputs}
                root-channel={rootChannel} theme={theme}></c-arc_ins-os-enrollee-benefits-summary-row>
        </template>
    </template>
    <vlocity_ins-ins-os-grid-product-modal theme={theme} root-channel={rootChannel}></vlocity_ins-ins-os-grid-product-modal>
</template>
